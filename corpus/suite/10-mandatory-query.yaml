# Mandatory query statements: MATCH, WHERE, RETURN, ORDER BY, and the
# aggregation a return statement does without being asked.
#
# ISO/IEC 39075 gives mandatory features no code, so every case here cites the
# subclause that specifies the behaviour. Nothing in this file may use a
# construct that features.xml lists as optional: no USE, no LIMIT, no OFFSET,
# no explicit GROUP BY, no UNION. An engine that fails one of these cannot
# claim GQL conformance at all, which is a much stronger statement than losing
# a feature, and the corpus earns the right to make it by staying inside the
# mandatory surface.

defaults:
  kind: mandatory
  fixture: social
  tags: [read]

cases:
  - id: mandatory/query/match-node-by-label
    name: A match statement binds every node carrying a label and a return statement projects one property
    subclauses: ["14.4", "14.11", "16.4"]
    productions: [match statement, return statement, node pattern, graph pattern]
    tags: [pattern]
    query: |
      MATCH (p:Person)
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Alice], [Bob], [Carol], [Dave], [Erin]]

  - id: mandatory/query/match-second-label
    name: A label in a node pattern selects only the nodes that carry it
    subclauses: ["14.4", "16.8"]
    productions: [label expression, element pattern filler, is label expression]
    tags: [pattern]
    query: |
      MATCH (c:Company)
      RETURN c.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Acme], [Globex]]

  - id: mandatory/query/return-multiple-items
    name: A return item list projects more than one value per binding
    subclauses: ["14.11"]
    productions: [return item list, return item, return item alias]
    query: |
      MATCH (p:Person)
      WHERE p.city = 'Lisbon'
      RETURN p.name AS name, p.age AS age
    expect:
      kind: rows
      unordered: true
      columns: [name, age]
      rows: [[Dave, 27]]

  - id: mandatory/query/return-distinct
    name: DISTINCT in a return statement body removes duplicate records
    subclauses: ["14.11", "22.12"]
    productions: [set quantifier, return statement body]
    query: |
      MATCH (p:Person)
      RETURN DISTINCT p.city AS city
    expect:
      kind: rows
      unordered: true
      columns: [city]
      rows: [[Berlin], [Paris], [Lisbon]]

  - id: mandatory/query/where-comparison
    name: A where clause keeps only the bindings its search condition holds for
    subclauses: ["16.13", "19.3"]
    productions: [where clause, search condition, comparison predicate]
    query: |
      MATCH (p:Person)
      WHERE p.age > 30
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Alice], [Carol], [Erin]]

  - id: mandatory/query/where-conjunction
    name: AND in a search condition requires both operands
    subclauses: ["16.13", "20.20"]
    productions: [boolean value expression, search condition]
    query: |
      MATCH (p:Person)
      WHERE p.age > 25 AND p.city = 'Berlin'
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Alice], [Carol]]

  - id: mandatory/query/where-disjunction
    name: OR in a search condition accepts either operand
    subclauses: ["16.13", "20.20"]
    productions: [boolean value expression]
    query: |
      MATCH (p:Person)
      WHERE p.city = 'Lisbon' OR p.age = 55
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Dave], [Erin]]

  - id: mandatory/query/where-negation
    name: NOT inverts a search condition that is true or false
    subclauses: ["16.13", "20.20"]
    productions: [boolean value expression]
    query: |
      MATCH (p:Person)
      WHERE NOT p.city = 'Berlin'
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Bob], [Dave], [Erin]]

  - id: mandatory/query/order-by-ascending
    name: An order by clause after a return statement sorts on a projected column
    subclauses: ["14.9", "16.16", "16.17"]
    productions: [order by and page statement, order by clause, sort specification]
    tags: [ordered]
    query: |
      MATCH (p:Person)
      RETURN p.name AS name
      ORDER BY name
    expect:
      kind: rows
      columns: [name]
      rows: [[Alice], [Bob], [Carol], [Dave], [Erin]]

  - id: mandatory/query/order-by-descending-then-ascending
    name: A sort specification list breaks ties on the next key and honours DESC
    subclauses: ["16.16", "16.17", "22.14"]
    productions: [sort specification list, ordering specification]
    tags: [ordered]
    query: |
      MATCH (p:Person)
      RETURN p.name AS name, p.age AS age
      ORDER BY age DESC, name ASC
    expect:
      kind: rows
      columns: [name, age]
      rows: [[Erin, 55], [Carol, 41], [Alice, 34], [Bob, 27], [Dave, 27]]

  - id: mandatory/query/count-star
    name: COUNT of asterisk counts bindings without reading a value
    subclauses: ["20.9"]
    productions: [aggregate function]
    tags: [aggregate]
    query: |
      MATCH (p:Person)
      RETURN COUNT(*) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: mandatory/query/aggregate-sum-min-max
    name: SUM, MIN and MAX reduce a whole binding table to one record
    subclauses: ["20.9"]
    productions: [general set function, general set function type]
    tags: [aggregate]
    query: |
      MATCH (p:Person)
      RETURN SUM(p.age) AS total, MIN(p.age) AS youngest, MAX(p.age) AS oldest
    expect:
      kind: rows
      columns: [total, youngest, oldest]
      rows: [[184, 27, 55]]

  - id: mandatory/query/aggregate-avg
    name: AVG of exact numbers is the exact mean, not an integer quotient
    subclauses: ["20.9"]
    productions: [general set function]
    tags: [aggregate]
    query: |
      MATCH (p:Person)
      RETURN AVG(p.age) AS mean
    expect:
      kind: rows
      columns: [mean]
      rows: [[36.8]]

  - id: mandatory/query/aggregate-count-distinct
    name: COUNT DISTINCT counts distinct values, not bindings
    subclauses: ["20.9", "22.12"]
    productions: [general set function, set quantifier]
    tags: [aggregate]
    query: |
      MATCH (p:Person)
      RETURN COUNT(DISTINCT p.age) AS ages
    expect:
      kind: rows
      columns: [ages]
      rows: [[4]]

  - id: mandatory/query/implicit-grouping
    name: A return statement groups on its non-aggregated items without a group by clause
    subclauses: ["14.11", "22.15"]
    productions: [return statement body, aggregate function]
    tags: [aggregate]
    query: |
      MATCH (p:Person)
      RETURN p.city AS city, COUNT(*) AS n
    expect:
      kind: rows
      unordered: true
      columns: [city, n]
      rows: [[Berlin, 2], [Paris, 2], [Lisbon, 1]]

  - id: mandatory/query/aggregate-over-empty-input
    name: COUNT over no bindings is zero and still returns one record
    subclauses: ["20.9"]
    productions: [aggregate function]
    tags: [aggregate, edge-case]
    query: |
      MATCH (p:Person)
      WHERE p.age > 200
      RETURN COUNT(*) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[0]]

  - id: mandatory/query/match-with-no-results
    name: A pattern that matches nothing yields no records and is not an error
    subclauses: ["14.4"]
    productions: [match statement]
    tags: [edge-case]
    query: |
      MATCH (x:Nonexistent)
      RETURN x.name AS name
    expect:
      kind: empty

  - id: mandatory/query/finish
    name: FINISH ends a query with no records rather than with an error
    subclauses: ["14.10"]
    productions: [primitive result statement]
    query: |
      MATCH (p:Person)
      FINISH
    expect:
      kind: empty

  - id: mandatory/query/return-without-match
    name: A linear query statement may be a return statement alone
    subclauses: ["14.3", "14.11"]
    productions: [ambient linear query statement, linear query statement]
    fixture: unit
    query: |
      RETURN 1 AS one
    expect:
      kind: rows
      columns: [one]
      rows: [[1]]

  - id: mandatory/query/order-by-as-a-statement
    name: An order by and page statement stands on its own inside a linear query statement
    subclauses: ["14.9"]
    productions: [order by and page statement, primitive query statement]
    tags: [ordered]
    query: |
      MATCH (p:Person)
      ORDER BY p.age, p.name
      RETURN p.name AS name, p.age AS age
    expect:
      kind: rows
      columns: [name, age]
      rows: [[Bob, 27], [Dave, 27], [Alice, 34], [Carol, 41], [Erin, 55]]
    # Bob and Dave share an age, so the case sorts on the name as well. An
    # ordered expectation with a tie in it would be testing which of two
    # correct answers an engine happens to give.

  - id: mandatory/query/the-shape-of-a-program
    name: The smallest useful GQL program is a query statement and the standard names every rule between the two
    subclauses: ["6", "9", "9.1", "14", "14.1", "16.3"]
    productions:
      - GQL-program
      - program activity
      - transaction activity
      - procedure specification
      - query specification
      - procedure body
      - statement block
      - statement
      - composite query statement
      - composite query expression
      - composite query primary
      - linear query statement
      - ambient linear query statement
      - simple linear query statement
      - simple query statement
      - match statement
      - simple match statement
      - graph pattern binding table
      - path pattern list
      - graph pattern where clause
      - primitive result statement
      - aggregating value expression
      - non-parenthesized value expression primary special case
      - property source
      - node reference value expression
    query: |
      MATCH (p:Person)
      WHERE p.city = 'Lisbon'
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Dave]]
    # Every other case in this file cites the two or three rules it is about.
    # This one cites twenty six because that is what it is for: the rules
    # between <GQL-program> and the pattern are the ones every case in the
    # corpus derives and none of them names, and a denominator of 814 that
    # never counts the spine of the grammar is measuring the wrong thing.
    # Every rule listed is on the single derivation of the query above, which
    # is checkable against Clause 6 and Clause 14 by reading down.
    #
    # The last four are the spine on the other side of RETURN. A return item
    # is an <aggregating value expression> whether or not it aggregates, and
    # p.name is a <property reference> whose source is the node p, so one
    # projected property derives the four rules that every projected property
    # in the corpus derives and that no case named.

  # The four cases below are the select statement, ISO 14.12. It is the second
  # way GQL spells a query and it is not an optional feature: no code in
  # features.xml gates it, and it hangs off <focused linear query statement>
  # beside the MATCH and RETURN form every other case in this file is written
  # in. An engine that reads only the MATCH form is missing mandatory GQL,
  # which is why these are mandatory cases and not optional ones.
  #
  # The graph expression in front of the match statement is not optional in
  # ISO's rule, so every case here names a graph rather than letting FROM open
  # straight onto MATCH. CURRENT_PROPERTY_GRAPH is the one spelling of a graph
  # expression that needs no catalog object, so it is the only one a portable
  # case can use.

  - id: mandatory/query/select-over-a-graph-match
    name: A select statement projects the rows a graph match binds
    subclauses: ["14.12"]
    productions:
      - select statement
      - select item list
      - select item
      - select item alias
      - select statement body
      - select graph match list
      - select graph match
    tags: [pattern]
    query: |
      SELECT p.name AS name, p.age AS age
      FROM CURRENT_PROPERTY_GRAPH MATCH (p:Person)
      WHERE p.age > 40
    expect:
      kind: rows
      unordered: true
      columns: [name, age]
      rows: [[Carol, 41], [Erin, 55]]
    # The where clause sits after the body rather than inside the match, which
    # is the shape ISO gives the select statement: the body binds the rows and
    # the clauses after it narrow, group and order what the body bound.

  - id: mandatory/query/select-from-a-nested-query
    name: A select statement may read from a nested query instead of from a graph
    subclauses: ["14.12"]
    productions: [select query specification]
    query: |
      SELECT *
      FROM { MATCH (p:Person) WHERE p.city = 'Lisbon' RETURN p.name AS name }
    expect:
      kind: rows
      columns: [name]
      rows: [[Dave]]
    # An asterisk keeps every column the nested query returned, so the case
    # measures the body and not a projection written over it.

  - id: mandatory/query/select-from-two-graph-matches
    name: A select statement body may list more than one graph match
    subclauses: ["14.12"]
    productions: [select graph match list]
    tags: [pattern]
    query: |
      SELECT p.name AS person, c.name AS company
      FROM CURRENT_PROPERTY_GRAPH MATCH (p:Person),
           CURRENT_PROPERTY_GRAPH MATCH (c:Company)
      WHERE p.name = 'Alice' AND c.name = 'Acme'
    expect:
      kind: rows
      columns: [person, company]
      rows: [[Alice, Acme]]
    # Two matches that share no variable bind every pairing of what each one
    # found, the same way two match statements written one after the other do,
    # so the where clause has thirty five rows to cut down to one.

  - id: mandatory/query/select-distinct
    name: A set quantifier in a select statement drops the duplicate rows
    subclauses: ["14.12"]
    productions: [set quantifier]
    query: |
      SELECT DISTINCT p.city AS city
      FROM CURRENT_PROPERTY_GRAPH MATCH (p:Person)
    expect:
      kind: rows
      unordered: true
      columns: [city]
      rows: [[Berlin], [Paris], [Lisbon]]
    # Five people live in three cities, so the quantifier is the whole of what
    # separates a right answer from a wrong one here.

  - id: mandatory/query/select-having
    name: A having clause tests the group a select statement aggregated
    subclauses: ["14.12"]
    productions: [having clause]
    tags: [aggregate]
    query: |
      SELECT COUNT(*) AS n
      FROM CURRENT_PROPERTY_GRAPH MATCH (p:Person)
      HAVING COUNT(*) > 3
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]
    # No group by clause, so the whole binding table is the one group and the
    # having clause has one row to keep or drop. The clause is written without
    # GROUP BY on purpose: an explicit group by clause is optional feature
    # GQ15 and a mandatory case may not lean on one.
