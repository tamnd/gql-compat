# Limit conditions: the sixteen codes ISO defines and declines to threshold.
#
# ISO reserves sixteen GQLSTATUS codes for an element carrying more labels,
# more properties or more key labels than the implementation supports, and then
# leaves every one of those numbers to the implementation. Subclause 24.5.2
# obliges an implementer to write the numbers down; it does not oblige them to
# be small. A case that picks a number of its own therefore has two correct
# answers waiting for it: an engine whose maximum is thirty-two must raise the
# code, and an engine that holds four thousand must accept the statement.
#
# Every case here carries `limit`, which names the implementation-defined item
# the answer measures, and a maximum case also carries `scale`, which says how
# to build the statement rather than what to put in it. The runner reads the
# engine's declared maximum for the item and expands `<<scale>>` to one unit
# past it, so each engine is asked the question its own limit makes answerable
# instead of a question about sixty-four that only some engines can reach.
#
# An engine that declares no maximum for the item is skipped, with the reason
# recorded, because there is no size a statement can ask for that reaches the
# condition. A minimum case cannot be scaled at all, since the smallest thing
# to ask for is nothing, so those are written out and skipped where the engine
# has no minimum. Neither skip is a failure: ISO names the code and leaves the
# number to the implementation, so there is no answer here the standard calls
# wrong.
#
# The codes come in pairs. ISO gives the same violation one code in class 22,
# raised when the engine builds the element, and another in class 42, raised
# when it reads the statement, and nothing written in the statement decides
# which moment the engine catches it in. Both are named, so both are counted
# and neither is scored as a mistake.

defaults:
  kind: condition
  tags: [error, write, limit]
  fixture: blank

cases:
  - id: condition/22g0p/node-past-the-label-maximum
    name: A node with more labels than the engine holds raises the node label maximum
    conditions: ["22G0P", "42010"]
    subclauses: ["13.2", "18.4"]
    productions: [insert statement, insert node pattern, label set specification]
    requires: [GD01]
    mutating: true
    limit: IL001
    scale:
      kind: node
      each: "L<<n>>"
      between: "&"
    query: |
      INSERT (:<<scale>>)
    expect:
      kind: error
      gqlstatus: "22G0P"
      also_gqlstatus: ["42010"]

  - id: condition/22g0n/node-with-no-labels
    name: A node with no labels raises the node label minimum where there is one
    conditions: ["22G0N", "42009"]
    subclauses: ["13.2", "18.4"]
    productions: [insert statement, insert node pattern]
    requires: [GD01]
    mutating: true
    limit: IL001
    # The other end of the same item: ISO lets an implementation require at
    # least one label on every node, and an implementation that does must
    # refuse this. Most do not, and the skip says so, which is worth recording
    # because a report that only ever tested maxima would leave the reader
    # thinking the minimum question was never asked.
    query: |
      INSERT ()
    expect:
      kind: error
      gqlstatus: "22G0N"
      also_gqlstatus: ["42009"]

  - id: condition/22g0s/node-past-the-property-maximum
    name: A node with more properties than the engine holds raises the node property maximum
    conditions: ["22G0S", "42011"]
    subclauses: ["13.2", "18.5"]
    productions: [insert statement, element property specification, property key value pair list]
    requires: [GD01]
    mutating: true
    limit: IL002
    # Property maxima are where a fixed number in the corpus hurt most. Labels
    # are cheap to bound and most engines bound them tightly, but an engine
    # that stores properties in a table column can hold thousands, so a case
    # asking for sixty-four measured nothing on it.
    scale:
      kind: node
      each: "p<<n>>: <<n>>"
      between: ", "
    query: |
      INSERT (:Wide {<<scale>>})
    expect:
      kind: error
      gqlstatus: "22G0S"
      also_gqlstatus: ["42011"]

  - id: condition/22g0r/edge-past-the-label-maximum
    name: An edge with more labels than the engine holds raises the edge label maximum
    conditions: ["22G0R", "42007"]
    subclauses: ["13.2", "18.4"]
    productions: [insert statement, insert edge pointing right, label set specification]
    requires: [GD01]
    mutating: true
    limit: IL001
    fixture: pair
    # ISO keeps separate limits for nodes and edges, so an engine may hold many
    # labels on one and one label on the other, and the scale block is keyed by
    # kind for exactly that reason. The pair fixture supplies the two endpoints;
    # the case is about what goes between them.
    scale:
      kind: edge
      each: "L<<n>>"
      between: "&"
    query: |
      MATCH (a:Person {name: 'Ada'}), (b:Person {name: 'Linus'})
      INSERT (a)-[:<<scale>>]->(b)
    expect:
      kind: error
      gqlstatus: "22G0R"
      also_gqlstatus: ["42007"]

  - id: condition/22g0q/edge-with-no-labels
    name: An edge with no labels raises the edge label minimum where there is one
    conditions: ["22G0Q", "42006"]
    subclauses: ["13.2", "18.4"]
    productions: [insert statement, insert edge pointing right]
    requires: [GD01]
    mutating: true
    limit: IL001
    fixture: pair
    query: |
      MATCH (a:Person {name: 'Ada'}), (b:Person {name: 'Linus'})
      INSERT (a)-[]->(b)
    expect:
      kind: error
      gqlstatus: "22G0Q"
      also_gqlstatus: ["42006"]

  - id: condition/22g0t/edge-past-the-property-maximum
    name: An edge with more properties than the engine holds raises the edge property maximum
    conditions: ["22G0T", "42008"]
    subclauses: ["13.2", "18.5"]
    productions: [insert statement, insert edge pointing right, property key value pair list]
    requires: [GD01]
    mutating: true
    limit: IL002
    fixture: pair
    scale:
      kind: edge
      each: "p<<n>>: <<n>>"
      between: ", "
    query: |
      MATCH (a:Person {name: 'Ada'}), (b:Person {name: 'Linus'})
      INSERT (a)-[:WIDE {<<scale>>}]->(b)
    expect:
      kind: error
      gqlstatus: "22G0T"
      also_gqlstatus: ["42008"]

  # ---------------------------------------------------------- key label sets
  #
  # A key label set is the part of an element type that identifies it, written
  # before the double arrow. Its cardinality has its own implementation-defined
  # item and its own four codes, and unlike the six above, all four live in
  # class 42: a graph type is read, never built, so there is no second moment
  # for the engine to catch the violation in.

  - id: condition/42013/node-type-past-the-key-label-maximum
    name: A node type with more key labels than the engine holds raises the key label maximum
    conditions: ["42013"]
    subclauses: ["12.6", "18.2"]
    productions: [create graph type statement, node type pattern, node type key label set]
    requires: [GC03, GG21]
    mutating: true
    limit: IL003
    tags: [error, write, limit, catalog]
    scale:
      kind: node
      each: "K<<n>>"
      between: "&"
    query: |
      CREATE PROPERTY GRAPH TYPE gqlcompat_keylabels_max {
        (:<<scale>> => :Wide)
      }
    expect:
      kind: error
      gqlstatus: "42013"

  - id: condition/42012/node-type-with-an-empty-key-label-set
    name: A node type with an empty key label set raises the key label minimum
    conditions: ["42012"]
    subclauses: ["12.6", "18.2"]
    productions: [create graph type statement, node type pattern, node type key label set]
    requires: [GC03, GG21]
    mutating: true
    limit: IL003
    tags: [error, write, limit, catalog]
    # The grammar admits a bare double arrow, so the key label set is empty
    # rather than absent. An implementation that requires at least one key
    # label has to say so here, and one that does not has to take it.
    query: |
      CREATE PROPERTY GRAPH TYPE gqlcompat_keylabels_min {
        (=> :Narrow)
      }
    expect:
      kind: error
      gqlstatus: "42012"

  - id: condition/42015/edge-type-past-the-key-label-maximum
    name: An edge type with more key labels than the engine holds raises the key label maximum
    conditions: ["42015"]
    subclauses: ["12.6", "18.3"]
    productions: [create graph type statement, edge type pattern pointing right, edge type key label set]
    requires: [GC03, GG21]
    mutating: true
    limit: IL003
    tags: [error, write, limit, catalog]
    scale:
      kind: edge
      each: "K<<n>>"
      between: "&"
    query: |
      CREATE PROPERTY GRAPH TYPE gqlcompat_edgekeys_max {
        (:Node)-[:<<scale>> => :Wide]->(:Node)
      }
    expect:
      kind: error
      gqlstatus: "42015"

  - id: condition/42014/edge-type-with-an-empty-key-label-set
    name: An edge type with an empty key label set raises the key label minimum
    conditions: ["42014"]
    subclauses: ["12.6", "18.3"]
    productions: [create graph type statement, edge type pattern pointing right, edge type key label set]
    requires: [GC03, GG21]
    mutating: true
    limit: IL003
    tags: [error, write, limit, catalog]
    query: |
      CREATE PROPERTY GRAPH TYPE gqlcompat_edgekeys_min {
        (:Node)-[=> :Narrow]->(:Node)
      }
    expect:
      kind: error
      gqlstatus: "42014"

  # ------------------------------------------------------------- confusables

  - id: condition/42004/two-identifiers-that-look-the-same
    name: Two identifiers that differ only in script raise use of visually confusable identifiers
    conditions: ["42004"]
    subclauses: ["16.4", "21.3"]
    productions: [element variable declaration, identifier, regular identifier]
    limit: IW014
    fixture: social
    tags: [error, identifier]
    # The second variable is spelled with Cyrillic U+0430, which renders
    # identically to the Latin a in most fonts and is a different character in
    # every encoding. ISO leaves the test for confusability to the
    # implementation, so an engine that treats these as two ordinary distinct
    # names is conformant and the skip records that its answer is no.
    query: |
      MATCH (a:Person), (а:Person)
      RETURN COUNT(*) AS n
    expect:
      kind: error
      gqlstatus: "42004"
