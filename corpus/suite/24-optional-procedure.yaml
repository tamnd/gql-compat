# Optional procedure features (GP): inline procedures, their variable scope,
# and the variable definitions a procedure body may open with.
#
# Named procedure calls, GP04, and GP14 and GP15, which are about what may be
# passed to one, have no cases here and are in `corpus/unwritable.yaml`
# instead. ISO defines the syntax of a named call but not a single procedure to
# call, and names its create statements after what they make, so there being no
# create procedure statement means no GQL program can put one in the catalog
# either. A portable case would have to invent a name, and every engine would
# fail it for the same uninteresting reason. An engine that wants credit for
# GP04 has to demonstrate it in its own dialect, which is what the `dialects`
# field is for; nothing in this suite can do it.
#
# The binding table variable definitions, GP08 through GP10, do have cases,
# which took working out. A binding table variable needs a binding table to
# be initialized from, and the obvious source is one in the catalog, which
# nothing here can put there portably. The two that are portable are a nested
# query, which needs no catalog at all, and a reference to a variable the same
# body already defined, so those are the two the cases use and the catalog
# never comes into it.

defaults:
  kind: optional
  fixture: social
  tags: [read, procedure]

cases:
  - id: optional/gp01/inline-procedure
    name: An inline procedure runs a nested query and yields its table
    features: [GP01]
    subclauses: ["15.1", "15.2", "14.5", "9.2", "4.7.6", "4.10.2.3"]
    productions:
      [
        call query statement,
        call procedure statement,
        procedure call,
        inline procedure call,
        nested procedure specification,
      ]
    # A call reaches <call procedure statement> down one of three rules,
    # depending on what the called body does. This body only reads, so the rule
    # above it is <call query statement>, and the other two are the cases
    # further down that call a body which writes.
    #
    # This is also the first case in the corpus where anything is called at all,
    # so it carries the two concepts a call brings with it. Subclause 4.10.2.3
    # is procedure execution, and 4.7.6 is the execution stack, which is where
    # the called body goes and the reason the outer statement still has its own
    # variables when the body is finished.
    query: |
      CALL { MATCH (p:Person) RETURN p.name AS name }
      RETURN name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Alice], [Bob], [Carol], [Dave], [Erin]]

  - id: optional/gp02/implicit-variable-scope
    name: Without a scope clause the outer variables are all in scope
    features: [GP01, GP02]
    subclauses: ["15.2"]
    productions: [inline procedure call, nested query specification]
    # The inner MATCH names `p`, which nothing inside the braces bound. With
    # the implicit scope it is the `p` from the outer MATCH, and each of the
    # three employed people yields one row.
    query: |
      MATCH (p:Person)
      CALL { MATCH (p)-[:WORKS_AT]->(c:Company) RETURN c.name AS company }
      RETURN p.name AS name, company AS company
    expect:
      kind: rows
      unordered: true
      columns: [name, company]
      rows:
        - [Alice, Acme]
        - [Bob, Acme]
        - [Carol, Globex]

  - id: optional/gp03/explicit-variable-scope
    name: A scope clause names exactly which outer variables the body sees
    features: [GP01, GP03]
    subclauses: ["15.2"]
    productions: [variable scope clause, binding variable reference list]
    query: |
      MATCH (p:Person)
      CALL (p) { MATCH (p)-[:WORKS_AT]->(c:Company) RETURN c.name AS company }
      RETURN p.name AS name, company AS company
    expect:
      kind: rows
      unordered: true
      columns: [name, company]
      rows:
        - [Alice, Acme]
        - [Bob, Acme]
        - [Carol, Globex]

  - id: optional/gp03/empty-variable-scope
    name: An empty scope clause shuts every outer variable out
    features: [GP01, GP03]
    subclauses: ["15.2"]
    productions: [variable scope clause]
    # With nothing in scope the body is a constant, so each of the five outer
    # rows is paired with the same one row from the body.
    query: |
      MATCH (p:Person)
      CALL () { MATCH (c:Company) WHERE c.name = 'Acme' RETURN c.name AS company }
      RETURN p.name AS name, company AS company
    expect:
      kind: rows
      unordered: true
      columns: [name, company]
      rows:
        - [Alice, Acme]
        - [Bob, Acme]
        - [Carol, Acme]
        - [Dave, Acme]
        - [Erin, Acme]

  - id: optional/gp05/value-variable-definition
    name: A procedure body may open by defining a value variable
    features: [GP01, GP05, GP06, GP17]
    subclauses: ["9.2", "10.3", "4.10.4.2"]
    productions: [binding variable definition block, binding variable definition, value variable definition]
    # Subclause 4.10.4.2 is binding variables and general parameters, which is
    # the concept a definition block is the syntax for: a name the whole body
    # can read that no clause in the body bound.
    query: |
      CALL {
        VALUE threshold = 40
        MATCH (p:Person)
        WHERE p.age > threshold
        RETURN p.name AS name
      }
      RETURN name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Carol], [Erin]]

  - id: optional/gp05/typed-value-variable-definition
    name: A value variable may declare its type
    features: [GP01, GP05, GP06, GP17]
    subclauses: ["10.3", "4.12.3"]
    productions: [value variable definition, opt typed value initializer, typed, double colon]
    # Subclause 4.12.3 is data type descriptors, and this is where the corpus
    # can point at one: writing the type beside the name is how a program asks
    # for a descriptor rather than leaving the engine to infer one from the
    # value. The case above is the same definition without it.
    query: |
      CALL {
        VALUE threshold :: INT = 40
        MATCH (p:Person)
        WHERE p.age > threshold
        RETURN p.name AS name
      }
      RETURN name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Carol], [Erin]]

  - id: optional/gp07/value-variable-from-a-subquery
    name: A value variable may be initialized from a scalar subquery
    features: [GP01, GP05, GP07, GP17]
    subclauses: ["10.3", "20.6"]
    productions: [value variable definition, value initializer]
    requires: [GQ18]
    query: |
      CALL {
        VALUE oldest = VALUE { MATCH (q:Person) RETURN MAX(q.age) }
        MATCH (p:Person)
        WHERE p.age = oldest
        RETURN p.name AS name
      }
      RETURN name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Erin]]

  - id: optional/gp11/graph-variable-definition
    name: A procedure body may bind a graph to a variable and then use it
    features: [GP01, GP11, GP12, GP17]
    subclauses: ["10.1"]
    productions: [graph variable definition, opt typed graph initializer, graph initializer]
    requires: [GQ01]
    # CURRENT_PROPERTY_GRAPH rather than a name: which graph the working graph
    # is called is the adapter's business, and a case that named one would be
    # testing the harness's configuration.
    query: |
      CALL {
        PROPERTY GRAPH g = CURRENT_PROPERTY_GRAPH
        USE g
        MATCH (p:Person)
        RETURN COUNT(*) AS n
      }
      RETURN n AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: optional/gp11/graph-variable-named-as-a-variable
    name: VARIABLE in front of a name says it is a variable and not a catalog object
    features: [GP01, GP11, GP12, GP17]
    subclauses: ["11.1", "11.3", "10.1"]
    productions: [object expression primary]
    requires: [GQ01]
    # A graph expression is a catalog reference, a name that could be either,
    # or one of these. The case above writes the bare name, which the engine
    # has to resolve by looking for a variable and then for a catalog object;
    # this writes the form that says which one it is before the engine looks.
    # An engine that reads only the bare name passes the case above and fails
    # this one, which is the difference the two cases are here to measure.
    query: |
      CALL {
        PROPERTY GRAPH g = CURRENT_PROPERTY_GRAPH
        USE VARIABLE g
        MATCH (p:Person)
        RETURN COUNT(*) AS n
      }
      RETURN n AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: optional/gp08/binding-table-variable-from-a-subquery
    name: A procedure body may bind a nested query's table to a variable
    features: [GP01, GP08, GP10, GP17]
    subclauses: ["10.2", "11.2", "4.3.6"]
    productions: [binding table variable definition, opt typed binding table initializer, binding table initializer, nested binding table query specification]
    requires: [GQ23]
    # The nested query is the only initializer a portable case can write that
    # does not need something in the catalog first, so this is where GP08 is
    # demonstrated as well as GP10: the parent feature is the definition and
    # the child is what the definition was given. Reading the table back is a
    # FOR over it, which is the one statement that takes a binding table and
    # makes rows of it, so the field read is the evidence that the variable
    # holds the table and not a copy of the query. Subclause 4.3.6 is binding
    # tables, and this is the only case in the corpus where one is a thing with
    # a name rather than what a statement happens to hand to the next one.
    query: |
      CALL {
        BINDING TABLE t = { MATCH (q:Person) WHERE q.age > 40 RETURN q.name AS name }
        FOR r IN t
        RETURN r.name AS name
      }
      RETURN name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Carol], [Erin]]

  - id: optional/gp09/binding-table-variable-from-a-reference
    name: A binding table variable may be initialized from another one
    features: [GP01, GP08, GP09, GP17]
    subclauses: ["10.2", "11.2"]
    productions: [binding table variable definition, binding table initializer, binding table expression, object name or binding variable]
    requires: [GQ23]
    # The other half of GP08. GP10 gives a definition a query and this gives
    # one a reference, and a reference to a variable the body has already
    # defined is the reference a portable case can write, nothing here being
    # able to put a table in the catalog. The second variable has to be the
    # table and not a value standing for it, which is what the FOR is asking:
    # a body that binds the name to a value instead answers one row holding
    # the whole table rather than a row for each of its rows.
    query: |
      CALL {
        BINDING TABLE older = { MATCH (q:Person) WHERE q.age > 40 RETURN q.name AS name }
        BINDING TABLE again = older
        FOR r IN again
        RETURN r.name AS name
      }
      RETURN name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Carol], [Erin]]

  - id: optional/gp13/graph-variable-from-a-subquery
    name: A graph variable may be initialized from a nested query answering a graph
    features: [GP01, GP11, GP13, GP17]
    subclauses: ["10.1", "20.6"]
    productions: [graph variable definition, graph initializer, graph expression, value query expression]
    requires: [GQ18, GQ01]
    # A graph expression reaches a nested query through the value query
    # expression, which is the one route the grammar gives it, so this is what
    # GP13 looks like written out: a query answering one row of one column
    # whose value is a graph, and the variable taking that value. The graph is
    # the working one for the same reason GP11's is, that what the working
    # graph is called is the harness's business and a case that named one
    # would be testing the configuration.
    query: |
      CALL {
        PROPERTY GRAPH g = VALUE { RETURN CURRENT_PROPERTY_GRAPH }
        USE g
        MATCH (p:Person)
        RETURN COUNT(*) AS n
      }
      RETURN n AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: optional/gp16/at-schema-clause
    name: A procedure body may name the schema it resolves names against
    features: [GP01, GP16]
    subclauses: ["9.2", "16.1"]
    productions: [at schema clause, schema reference, predefined schema reference]
    query: |
      CALL {
        AT CURRENT_SCHEMA
        MATCH (p:Person)
        RETURN COUNT(*) AS n
      }
      RETURN n AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: optional/gp18/catalog-and-data-statement-mixing
    name: One procedure body may hold both a catalog statement and a data statement
    features: [GP01, GP18, GC04]
    subclauses: ["9.2", "12.1"]
    productions: [statement block, next statement, linear catalog-modifying statement]
    requires: [GQ20]
    tags: [write, catalog, procedure]
    mutating: true
    # ISO makes this a feature rather than a rule because an implementation is
    # allowed to refuse the mix outright, with 25G02. An engine that does is
    # not failing to implement CREATE; it is declining GP18, and the report
    # should read it that way.
    query: |
      CALL {
        CREATE PROPERTY GRAPH gqlcompat_mixed ANY
        NEXT
        MATCH (p:Person)
        RETURN COUNT(*) AS n
      }
      RETURN n AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: optional/gp01/optional-call
    name: OPTIONAL CALL keeps the row when the body yields nothing
    features: [GP01, GP03]
    subclauses: ["15.1"]
    productions: [call procedure statement]
    tags: [read, procedure, "null"]
    query: |
      MATCH (p:Person)
      OPTIONAL CALL (p) { MATCH (p)-[:WORKS_AT]->(c:Company) RETURN c.name AS company }
      RETURN p.name AS name, company AS company
    expect:
      kind: rows
      unordered: true
      columns: [name, company]
      rows:
        - [Alice, Acme]
        - [Bob, Acme]
        - [Carol, Globex]
        - [Dave, null]
        - [Erin, null]

  - id: optional/gp01/call-a-body-that-writes
    name: A call whose body writes is a data-modifying statement and not a query
    features: [GP01, GD01]
    subclauses: ["13.6", "15.1", "4.10.2.4"]
    productions: [call data-modifying procedure statement]
    tags: [write, procedure]
    fixture: blank
    mutating: true
    # Which of the three rules a CALL derives is settled by the body and not by
    # the call, so this statement and the inline procedure case at the top of
    # the file are the same words over a different body and take different
    # paths through Clause 13 and Clause 14. The MATCH after it is what makes
    # the case evidence rather than an accept: the node the called body wrote
    # is there to be found. That settling is subclause 4.10.2.4, procedures
    # classified by kind of side effects, which is the concept the three rules
    # of Clause 15 are the syntax for.
    query: |
      CALL { INSERT (:Note {t: 'x'}) }
      MATCH (n:Note)
      RETURN n.t AS t
    expect:
      kind: rows
      columns: [t]
      rows: [[x]]

  - id: optional/gp01/call-a-body-that-changes-the-catalog
    name: A call whose body changes the catalog is a catalog-modifying statement
    features: [GP01, GC04, GP18]
    subclauses: ["12.8", "15.1"]
    productions:
      [call catalog-modifying procedure statement, catalog-modifying procedure specification]
    tags: [write, catalog, procedure]
    mutating: true
    # The third of the three, and the one an engine is most likely to refuse
    # outright, which is a conformant answer and the reason GP18 is claimed
    # beside GP01 here.
    query: |
      CALL { CREATE GRAPH gqlcompat_call_catalog ANY }
    expect:
      kind: accept
