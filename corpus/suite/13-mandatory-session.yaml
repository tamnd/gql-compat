# Mandatory session commands: naming the schema and the graph a session works
# against.
#
# Clause 7 has four SESSION SET clauses and features.xml gives a code to two of
# them. The parameter clauses are GS01 through GS03 and the time zone clause is
# GS15, and every SESSION RESET clause has a code of its own from GS04 to GS16.
# The schema clause and the graph clause have none. By the rule this corpus
# holds itself to, a construct that features.xml does not list as optional is
# mandatory, and these are the two.
#
# That reading is worth stating out loud because it looked wrong at first. It
# seems strange that resetting the session schema is an optional feature and
# setting it is not. It is not strange once you read what the two do. Setting
# the session schema is how a program says which catalog its unqualified names
# are resolved in, and a GQL-implementation with no way to say that has no way
# to run a program against anything but one schema. Resetting it is a
# convenience for putting the value back without knowing what it was, which is
# a different and smaller thing, and ISO charges a feature code for it.
#
# The one clause of Clause 7 that is not here is SESSION CLOSE. A case for it
# would end the session the harness is measuring in, so an engine that
# implements it correctly leaves the run with no connection for the next case
# and an engine that does not implement it fails. That is a harness gap rather
# than a grammar one, and it wants a way to mark a case as the last thing a
# session does. It is not in the uncitable register, because the register is
# for claims about the shape of the grammar and this is a claim about this
# project's runner.

defaults:
  kind: mandatory
  tags: [write, session]

cases:
  - id: mandatory/session/set-schema-at-the-root
    name: A session may be pointed at the root of the catalog
    subclauses: ["7", "7.1", "4.5.1", "4.5.2.1", "4.5.2.3", "4.7.4", "4.10.1", "4.10.3"]
    productions:
      [
        session set command,
        session set schema clause,
        schema reference,
        absolute catalog schema reference,
        solidus,
      ]
    mutating: true
    # The root is the one schema reference every engine has, because it is the
    # one the catalog cannot be missing. ISO spells it as a bare solidus, which
    # is the first alternative of an absolute catalog schema reference and the
    # only one that needs no schema to have been created first. That is what
    # makes this the mandatory case: it asks for the clause and asks for
    # nothing else.
    #
    # The two Clause 4 citations beside the session context are what the clause
    # is for and what it is. Subclause 4.7.4 is the working schema reference,
    # which is where a request looks when a name in it is not qualified, and the
    # session schema is what that starts out as. Subclause 4.10.3 is commands as
    # against procedures: this is a whole program with no query in it, which is
    # the distinction that subclause draws, and 4.10.1 is where the standard
    # draws it. The other two are what the clause acts on. Subclause 4.5.1 is
    # the GQL-session, which is the only thing in GQL that outlives a statement
    # and the reason this command has anything to change, and 4.5.2.1 is the
    # session context, the record of that session a SESSION SET writes into.
    query: |
      SESSION SET SCHEMA /
    expect:
      kind: accept

  - id: mandatory/session/set-schema-by-a-predefined-name
    name: HOME_SCHEMA and CURRENT_SCHEMA name a schema without spelling a path
    subclauses: ["7", "7.1", "17.1"]
    productions:
      [
        session set schema clause,
        schema reference,
        relative catalog schema reference,
        predefined schema reference,
      ]
    mutating: true
    # A predefined schema reference is the relative half of a schema reference
    # that needs no path at all. HOME_SCHEMA is where the session started and
    # CURRENT_SCHEMA is where it is now, so setting the schema to the second is
    # a statement with no effect, which is the point: it exercises the clause
    # without depending on any schema this corpus did not create.
    setup:
      - "SESSION SET SCHEMA HOME_SCHEMA"
    query: |
      SESSION SET SCHEMA CURRENT_SCHEMA
    expect:
      kind: accept

  - id: mandatory/session/set-schema-at-a-relative-path
    name: A schema reference may climb out of the current schema with two periods
    subclauses: ["7", "7.1", "17.1", "4.3.2"]
    productions:
      [
        relative catalog schema reference,
        relative directory path,
        double period,
        schema name,
      ]
    mutating: true
    # The other relative form is a path. Two periods is the parent, and what
    # follows the solidus is a schema name read from there, which is the same
    # convention a filesystem uses and the reason ISO borrowed the spelling.
    # Subclause 4.3.2 is references to schemas and objects, and a relative one
    # is where that subclause has anything to say: an absolute reference means
    # the same thing wherever it is written and this one does not.
    # zu takes only the absolute form and reports "expected an absolute
    # directory path, found '..'", so it has the predefined half of a relative
    # schema reference and not the path half.
    query: |
      SESSION SET SCHEMA ../gqlcompat_sibling
    expect:
      kind: accept

  - id: mandatory/session/set-graph
    name: A session may be pointed at a graph
    subclauses: ["7", "7.1", "4.5.2.3", "4.7.5"]
    productions: [session set command, session set graph clause, graph expression]
    mutating: true
    # PROPERTY is optional in this clause the way it is optional in CREATE
    # PROPERTY GRAPH, and the longer spelling is written here because the
    # shorter one is spelled in the case below. The graph named is the one the
    # session is already on, for the reason the CURRENT_SCHEMA case gives:
    # what the working graph is called is the adapter's business, and a case
    # that spelled a name would be measuring the fixture. Subclause 4.7.5 is
    # that working graph site, the graph a statement reads and writes when no
    # statement in it says otherwise, and this clause is how a session names it.
    query: |
      SESSION SET PROPERTY GRAPH CURRENT_PROPERTY_GRAPH
    expect:
      kind: accept

  - id: mandatory/session/set-graph-without-the-property-keyword
    name: PROPERTY is optional in the session graph clause
    subclauses: ["7", "7.1", "17.2"]
    productions: [session set graph clause, graph expression, graph reference, home graph]
    mutating: true
    # The shorter spelling, and a different graph expression under it: a home
    # graph rather than a current one. An engine that takes one of these two
    # cases and not the other has the clause and not both of its spellings,
    # which is a difference a report can only show if the two are separate
    # cases.
    query: |
      SESSION SET GRAPH HOME_PROPERTY_GRAPH
    expect:
      kind: accept
