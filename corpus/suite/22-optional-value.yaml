# Optional value features: literal notations (GL), value types (GV),
# functions (GF), and the GA and GB features about how a value is written and
# compared.
#
# Numeric expectations here are all exactly representable in binary floating
# point. The comparison the harness makes has no tolerance, because a
# tolerance is a policy about precision and ISO specifies none; a case that
# needed one would be asserting something the standard does not say.

defaults:
  kind: optional
  fixture: unit
  tags: [read, expression]

cases:
  - id: optional/gb02/double-minus-comment
    name: A line starting with two minus signs is a comment
    features: [GB02]
    subclauses: ["21.3"]
    productions:
      [
        comment,
        simple comment,
        simple comment introducer,
        double minus sign,
        simple comment character,
        newline,
      ]
    tags: [lexical]
    # <simple comment> ::= <simple comment introducer> [ <simple comment
    # character>... ] <newline>, so a comment on a line of its own derives all
    # three parts of the rule and not only its introducer. The text of the
    # comment is the run of simple comment characters and the line break after
    # it is the newline, which is the part that ends the comment: an engine
    # that reads to the end of the input instead swallows the RETURN.
    query: |
      -- this line is a comment
      RETURN 1 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[1]]

  - id: optional/gb03/double-solidus-comment
    name: A line starting with two solidi is a comment
    features: [GB03]
    subclauses: ["21.3"]
    productions:
      [
        simple comment,
        simple comment introducer,
        double solidus,
        simple comment character,
        newline,
      ]
    tags: [lexical]
    query: |
      // this line is a comment
      RETURN 1 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[1]]

  - id: optional/gl01/hexadecimal-literal
    name: A 0x literal denotes an integer in hexadecimal
    features: [GL01]
    subclauses: ["21.2"]
    productions: [unsigned hexadecimal integer, unsigned integer]
    tags: [lexical]
    query: |
      RETURN 0xFF AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[255]]

  - id: optional/gl02/octal-literal
    name: A 0o literal denotes an integer in octal
    features: [GL02]
    subclauses: ["21.2"]
    productions: [unsigned octal integer]
    tags: [lexical]
    query: |
      RETURN 0o17 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[15]]

  - id: optional/gl03/binary-literal
    name: A 0b literal denotes an integer in binary
    features: [GL03]
    subclauses: ["21.2"]
    productions: [unsigned binary integer]
    tags: [lexical]
    query: |
      RETURN 0b1010 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[10]]

  - id: optional/gl04/exact-number-without-suffix
    name: A number written with a decimal point and no suffix is an exact number
    features: [GL04]
    subclauses: ["21.2"]
    productions: [exact numeric literal, unsigned decimal in common notation]
    tags: [lexical]
    query: |
      RETURN 2.5 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[2.5]]

  - id: optional/gl05/exact-number-with-suffix
    name: The M suffix marks a literal as an exact number
    features: [GL05]
    subclauses: ["21.2"]
    productions: [exact numeric literal, exact number suffix]
    tags: [lexical]
    query: |
      RETURN 1.25M AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[1.25]]

  - id: optional/gl06/exact-number-scientific-with-suffix
    name: Scientific notation with the M suffix is an exact number
    features: [GL06]
    subclauses: ["21.2"]
    productions: [unsigned decimal in scientific notation, exact number suffix]
    tags: [lexical]
    query: |
      RETURN 1.5E2M AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[150]]

  - id: optional/gl07/approximate-number-with-suffix
    name: The F suffix marks a literal as an approximate number
    features: [GL07]
    subclauses: ["21.2"]
    productions: [approximate numeric literal, approximate number suffix]
    tags: [lexical]
    query: |
      RETURN 2.5F AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[2.5]]

  - id: optional/gl08/approximate-number-scientific-with-suffix
    name: Scientific notation with the F suffix is an approximate number
    features: [GL08]
    subclauses: ["21.2"]
    productions: [approximate numeric literal]
    tags: [lexical]
    query: |
      RETURN 1.5E2F AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[150]]

  - id: optional/gl11/opt-out-character-escaping
    name: An at sign before a quoted string turns off escape processing
    features: [GL11]
    subclauses: ["21.2", "21.3"]
    productions:
      [
        character string literal,
        no escape,
        single quoted character sequence,
        commercial at,
      ]
    tags: [lexical]
    # <single quoted character sequence> ::= [ <no escape> ] <unbroken single
    # quoted character sequence>, so the at sign is inside the sequence rule
    # rather than in front of it, and this is the only case in the corpus that
    # takes the optional half of that rule.
    query: |
      RETURN @'a\nb' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [["a\\nb"]]

  - id: optional/ga01/binary-floating-point-arithmetic
    name: Arithmetic on 64 bit floats rounds the way IEEE 754 says
    features: [GA01]
    requires: [GA05, GV24]
    subclauses: ["4.16.5.5", "20.21"]
    productions: [numeric value expression, term, cast specification]
    # A tenth has no exact binary representation, so the two nearest doubles to
    # 0.1 and 0.2 add up to something that is not the nearest double to 0.3.
    # An engine doing IEEE 754 arithmetic says so and an engine doing exact
    # decimal arithmetic says the two sides are equal, which is the difference
    # this feature names. The comparison is between values the engine itself
    # produced, so nothing here depends on how a literal is typed.
    query: |
      RETURN CAST(0.1 AS FLOAT64) + CAST(0.2 AS FLOAT64) <> CAST(0.3 AS FLOAT64) AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/ga05/cast-string-to-integer
    name: CAST converts a character string to an integer
    features: [GA05]
    subclauses: ["20.8"]
    productions: [cast specification, cast operand, cast target]
    query: |
      RETURN CAST('42' AS INT) AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[42]]

  - id: optional/ga05/cast-integer-to-string
    name: CAST converts an integer to a character string
    features: [GA05]
    subclauses: ["20.8"]
    productions: [cast specification, value type]
    query: |
      RETURN CAST(42 AS STRING) AS v
    expect:
      kind: rows
      columns: [v]
      rows: [["42"]]

  - id: optional/ga05/cast-string-to-date
    name: CAST reads a character string as a date
    features: [GA05]
    requires: [GV39]
    subclauses: ["20.8", "21.2"]
    productions: [cast specification, cast target, temporal type]
    tags: [temporal]
    # The value is compared with the literal of the same type rather than
    # returned, because a returned date crosses the driver boundary as whatever
    # that driver calls a date and the corpus would be asserting the driver.
    query: |
      RETURN CAST('2024-01-15' AS DATE) = DATE '2024-01-15' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/ga05/cast-datetime-to-date
    name: CAST of a datetime to a date keeps the day and drops the time
    features: [GA05]
    requires: [GV39]
    subclauses: ["20.8", "21.2"]
    productions: [cast specification, cast target, temporal type]
    tags: [temporal]
    # A quarter to two in the afternoon is the same day as midnight, so the
    # cast that truncates agrees with the date literal and the one that rounds
    # to the nearest day does not.
    query: |
      RETURN CAST(LOCAL DATETIME '2024-01-15T13:45:00' AS DATE) = DATE '2024-01-15' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/ga05/cast-date-to-datetime
    name: CAST of a date to a datetime fills the time of day with midnight
    features: [GA05]
    requires: [GV39]
    subclauses: ["20.8", "21.2"]
    productions: [cast specification, cast target, temporal type]
    tags: [temporal]
    query: |
      RETURN CAST(DATE '2024-01-15' AS LOCAL DATETIME) = LOCAL DATETIME '2024-01-15T00:00:00' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/ga05/cast-date-to-string
    name: CAST of a date to a character string writes it the way a date is written
    features: [GA05]
    requires: [GV39]
    subclauses: ["20.8", "21.2"]
    productions: [cast specification, character string type]
    tags: [temporal]
    # The one temporal case whose result is a string, which is what makes it
    # comparable across drivers without asking any of them what a date is.
    query: |
      RETURN CAST(DATE '2024-01-15' AS STRING) AS v
    expect:
      kind: rows
      columns: [v]
      rows: [["2024-01-15"]]

  - id: optional/ga06/value-type-predicate
    name: A value type predicate tests a value against a type
    features: [GA06]
    subclauses: ["19.6"]
    productions: [value type predicate, value type predicate part 2, typed]
    query: |
      RETURN (1 IS TYPED INT) AS a, ('x' IS NOT TYPED INT) AS b
    expect:
      kind: rows
      columns: [a, b]
      rows: [[true, true]]

  - id: optional/gf01/floor-ceiling-absolute
    name: FLOOR, CEIL and ABS operate on an exact number
    features: [GF01]
    subclauses: ["20.22"]
    productions: [floor function, ceiling function, absolute value expression]
    fixture: numbers
    # ISO names GF01 "Enhanced numeric functions" and does not say which of
    # subclause 20.22's functions are the enhanced ones. Trigonometry,
    # logarithms, CARDINALITY and SIZE are carved out as GF02, GF03, GF12 and
    # GF13, and CHAR_LENGTH and PATH_LENGTH read as basic, which leaves
    # FLOOR, CEIL, ABS, MOD, POWER, SQRT and EXP for GF01. That is an
    # inference, not a quotation, and an engine that disagrees will show up as
    # a GF01 skip rather than as a failure.
    query: |
      MATCH (v:Datum)
      WHERE v.n = 3
      RETURN FLOOR(v.x) AS down, CEIL(v.x) AS up, ABS(-v.x) AS magnitude
    expect:
      kind: rows
      columns: [down, up, magnitude]
      rows: [[2, 3, 2.5]]

  - id: optional/gf01/power-square-root-modulus
    name: POWER, SQRT and MOD are numeric value functions
    features: [GF01]
    subclauses: ["20.22"]
    productions:
      [
        power function,
        square root,
        modulus expression,
        exponential function,
        numeric value expression base,
        numeric value expression exponent,
        numeric value expression dividend,
        numeric value expression divisor,
      ]
    # EXP is here rather than with the logarithms because GF03 names the
    # logarithmic functions and EXP is not one, which leaves it in the
    # unnamed remainder this corpus reads as GF01. Its argument is zero, the
    # one input whose answer every implementation must agree on exactly.
    query: |
      RETURN POWER(2, 3) AS p, SQRT(16) AS r, MOD(7, 3) AS m, EXP(0) AS e
    expect:
      kind: rows
      columns: [p, r, m, e]
      rows: [[8, 4, 1, 1]]

  - id: optional/gf02/trigonometric-functions
    name: SIN and COS are trigonometric functions of a numeric expression
    features: [GF02]
    subclauses: ["20.22"]
    productions: [trigonometric function, trigonometric function name]
    # Zero is the only argument whose sine and cosine every implementation
    # must agree on to the last bit, and the comparison here has no tolerance.
    query: |
      RETURN SIN(0) AS s, COS(0) AS c
    expect:
      kind: rows
      columns: [s, c]
      rows: [[0, 1]]

  - id: optional/gf03/logarithmic-functions
    name: LN, LOG10 and LOG compute logarithms
    features: [GF03]
    subclauses: ["20.22"]
    productions:
      [
        natural logarithm,
        common logarithm,
        general logarithm function,
        general logarithm base,
        general logarithm argument,
      ]
    query: |
      RETURN LN(1) AS n, LOG10(100) AS c, LOG(2, 8) AS g
    expect:
      kind: rows
      columns: [n, c, g]
      rows: [[0, 2, 3]]

  - id: optional/gf06/explicit-trim
    name: The explicit TRIM form names what to trim and from which end
    features: [GF06]
    subclauses: ["20.24"]
    productions: [trim function, trim operands, trim specification]
    query: |
      RETURN TRIM(LEADING 'x' FROM 'xxay') AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[ay]]

  - id: optional/gf05/multi-character-trim
    name: BTRIM, LTRIM and RTRIM trim a set of characters
    features: [GF05]
    subclauses: ["20.24"]
    productions: [multi-character trim function]
    query: |
      RETURN LTRIM('xxay', 'x') AS l, RTRIM('xxay', 'y') AS r
    expect:
      kind: rows
      columns: [l, r]
      rows: [[ay, xxa]]

  - id: optional/gf10/collect-list
    name: COLLECT_LIST aggregates a column into one list value
    features: [GF10, GF12]
    subclauses: ["20.9"]
    productions: [general set function, cardinality expression]
    fixture: numbers
    tags: [aggregate]
    # The order of a collected list is not specified, so the case asserts its
    # length. Asserting the elements would be asserting an accident.
    query: |
      MATCH (v:Datum)
      RETURN CARDINALITY(COLLECT_LIST(v.n)) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[4]]

  - id: optional/gf11/percentile-disc
    name: PERCENTILE_DISC is a binary set function over a column and a fraction
    features: [GF11]
    subclauses: ["20.9"]
    productions:
      [
        binary set function,
        binary set function type,
        dependent value expression,
        independent value expression,
      ]
    fixture: numbers
    tags: [aggregate]
    # The two arguments have rules of their own because they are not the same
    # kind of thing. The first is read once per binding and the second once for
    # the whole group, which is what dependent and independent name, and it is
    # the only place in the grammar the distinction is written down.
    query: |
      MATCH (v:Datum)
      RETURN PERCENTILE_DISC(v.n, 1) AS p
    expect:
      kind: rows
      columns: [p]
      rows: [[4]]

  - id: optional/gv50/list-value-constructor
    name: A list value constructor builds a list from an enumeration
    features: [GV50]
    subclauses: ["20.17", "21.2"]
    productions:
      [
        list value constructor,
        list value constructor by enumeration,
        list element list,
        list element,
        list literal,
        left bracket,
        right bracket,
        comma,
      ]
    # A list literal is a list value constructor by enumeration and nothing
    # else, so the grammar reaches this query two ways: as a literal under
    # <general literal> and as a constructor under <value expression primary>.
    # Both citations are on the one derivation ISO wrote, which is why they sit
    # on one case rather than on two.
    tags: [list]
    query: |
      RETURN [1, 2, 3] AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[[1, 2, 3]]]

  - id: optional/gf12/cardinality-of-list-property
    name: CARDINALITY counts the elements of a stored list
    features: [GF12, GV50]
    subclauses: ["20.22"]
    productions: [cardinality expression, cardinality expression argument]
    fixture: listed
    tags: [list]
    query: |
      MATCH (b:Bag)
      RETURN CARDINALITY(b.xs) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[3]]

  - id: optional/gf13/size-of-list-property
    name: SIZE is the list-only spelling of the same count
    features: [GF13, GV50]
    subclauses: ["20.22"]
    productions: [cardinality expression, list value expression]
    fixture: listed
    tags: [list]
    query: |
      MATCH (b:Bag)
      RETURN SIZE(b.xs) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[3]]

  - id: optional/gf20/aggregate-in-a-sort-key
    name: A sort key may be an aggregate the projection does not return
    features: [GF20]
    subclauses: ["16.17", "20.9"]
    productions: [sort key, sort specification, aggregate function, general set function]
    fixture: social
    tags: [aggregate, ordered]
    # The aggregate is in the sort key and nowhere else, which is the whole of
    # what this feature adds: without it a query that wants the busiest person
    # first has to return the count it does not want, and then the columns are
    # decided by the ordering rather than by the question. The counts here are
    # two for Alice and one for the other three, so the tie is broken by name
    # and the row order is decided rather than accidental. Erin knows nobody
    # and so is not a row at all, the pattern requiring an edge.
    query: |
      MATCH (p:Person)-[:KNOWS]->(f:Person)
      RETURN p.name AS name
      ORDER BY count(f) DESC, name
    expect:
      kind: rows
      columns: [name]
      rows: [[Alice], [Bob], [Carol], [Dave]]

  - id: optional/gv39/date-literal-comparison
    name: A date literal compares equal to a stored date
    features: [GV39]
    subclauses: ["21.2", "4.16.6.2"]
    productions: [date literal, temporal literal]
    fixture: dated
    tags: [temporal]
    query: |
      MATCH (e:Event)
      WHERE e.happened = DATE '2024-01-15'
      RETURN e.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[launch]]

  - id: optional/gv41/duration-literal-comparison
    name: A duration literal compares equal to a stored duration
    features: [GV41]
    subclauses: ["21.2", "4.16.6.3"]
    productions: [duration literal]
    fixture: dated
    tags: [temporal]
    query: |
      MATCH (e:Event)
      WHERE e.takes = DURATION 'P2D'
      RETURN e.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[launch]]

  - id: optional/gv45/record-value
    name: A record value is a brace, a list of fields and a closing brace
    features: [GV45]
    subclauses: ["20.18", "20.19", "21.2"]
    productions:
      [
        record constructor,
        record literal,
        fields specification,
        field list,
        field,
        field name,
        left brace,
        right brace,
        colon,
      ]
    # Every other record in the corpus is an argument to a function or an
    # operand of a comparison, so the corpus had records and had never returned
    # one. RECORD is optional in front of the brace and is left off here
    # because the shorter spelling is the one a record in an expression
    # position is written in, and because <record literal> reaches the
    # constructor only through this form.
    query: |
      RETURN {a: 1, b: 'x'} AS r
    expect:
      kind: rows
      columns: [r]
      rows: [[{a: 1, b: x}]]

  - id: optional/gv45/record-field-read
    name: A field of a record is read with the period a property is read with
    features: [GV45]
    subclauses: ["20.11", "20.18"]
    productions: [record expression, property source, property reference]
    # A property reference has three kinds of source and the other two are a
    # node and an edge. This is the third, and it is the only one that needs
    # no graph, because the record is written in the query. The grammar spells
    # the reference the same way for all three, which is the point the case
    # is making: the period is not about elements.
    query: |
      RETURN {a: 1, b: 'x'}.a AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[1]]

  - id: optional/gl09/float-number-suffix
    name: An F suffix writes a literal as single precision
    features: [GL09]
    subclauses: ["21.2", "4.16.5.5"]
    productions: [approximate numeric literal, approximate number suffix]
    tags: [lexical, numeric]
    # 1.5 is exact in both single and double precision, so the row is the same
    # whichever the engine widens to and the only thing the case measures is
    # whether the suffix parses.
    query: |
      RETURN 1.5F AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[1.5]]

  - id: optional/gl10/double-number-suffix
    name: A D suffix writes a literal as double precision
    features: [GL10]
    subclauses: ["21.2", "4.16.5.5"]
    productions: [approximate numeric literal, approximate number suffix]
    tags: [lexical, numeric]
    query: |
      RETURN 1.5D AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[1.5]]

  - id: optional/gl12/sql-interval-year-to-month
    name: A duration written the SQL way, with a qualifier saying which fields it holds
    features: [GL12]
    requires: [GV41]
    subclauses: ["21.2"]
    productions: [duration literal, SQL-interval literal]
    tags: [lexical, temporal]
    # The qualifier and not the string is what says which fields were written,
    # so the same three characters are a year and two months here and are not a
    # duration at all under a qualifier of DAY. The case compares against the
    # ISO 8601 spelling rather than reading a duration back as text, because how
    # a duration prints is a separate question and one engine's answer to it
    # would otherwise decide this case.
    query: |
      RETURN INTERVAL '1-2' YEAR TO MONTH = DURATION 'P1Y2M' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/gl12/sql-interval-day-to-second
    name: The day and time half of the same spelling, written as SQL writes it
    features: [GL12]
    requires: [GV41]
    subclauses: ["21.2"]
    productions: [duration literal, SQL-interval literal]
    tags: [lexical, temporal]
    # A space between the day and the clock and colons inside it, which is the
    # SQL shape and is not the ISO 8601 one. An engine that reads the string
    # without the qualifier has nothing to tell it where the day ends.
    query: |
      RETURN INTERVAL '3 04:05:06' DAY TO SECOND = DURATION 'P3DT4H5M6S' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/gl12/sql-datetime-literal
    name: A datetime written with a space where ISO 8601 writes a T
    features: [GL12]
    requires: [GV40]
    subclauses: ["21.2"]
    productions: [datetime literal, SQL-datetime literal]
    tags: [lexical, temporal]
    # The other half of the same feature. Both spellings name one instant, so
    # an engine that reads only the T answers this case with a syntax error and
    # an engine that reads both answers true.
    query: |
      RETURN TIMESTAMP '2024-01-15 10:00:00+00:00' = ZONED DATETIME '2024-01-15T10:00:00Z' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/ga04/comparing-values-of-different-types
    name: Universal comparison orders values that are not of one type
    features: [GA04]
    subclauses: ["22.20", "19.3"]
    productions: [comparison predicate, comparison predicate part 2]
    # ISO gives value types a precedence so that any two values can be ordered,
    # and an engine without the feature raises 22G04 instead. Which of the two
    # values this engine calls smaller depends on that precedence, so the case
    # asserts only that the comparison was answered rather than refused; the
    # 22G04 case in 31-conditions-value.yaml is the other half of the pair.
    query: |
      RETURN 1 < 'a' AS v
    expect:
      kind: accept

  - id: optional/ge06/path-value-construction
    name: PATH builds a path value out of nodes and edges
    features: [GE06]
    subclauses: ["20.14", "4.11.2"]
    productions: [path value constructor, path value constructor by enumeration, path element list, path element list start]
    requires: [GA09]
    fixture: chain
    tags: [read, expression, path]
    # The constructed path names the same three elements the pattern matched,
    # so it must equal the matched path. Comparing them is what makes the case
    # evidence about the value that was built rather than about the statement
    # parsing, and it needs GA09, which is why the case requires it.
    query: |
      MATCH p = (a:Step)-[e:LINK]->(b:Step)
      WHERE a.step = 0
      RETURN PATH [a, e, b] = p AS alike
    expect:
      kind: rows
      columns: [alike]
      rows: [[true]]

  - id: optional/ga09/comparing-two-paths
    name: Two paths over the same elements compare equal
    features: [GA09]
    subclauses: ["22.13", "4.11.2"]
    productions: [comparison predicate, path value expression]
    fixture: chain
    tags: [read, expression, path]
    # Both patterns match the same one-hop path from n0, so the two bindings
    # are the same path and an engine that compares paths at all must say so.
    query: |
      MATCH p = (a:Step)-[:LINK]->(b:Step), q = (c:Step)-[:LINK]->(d:Step)
      WHERE a.step = 0 AND c.step = 0
      RETURN p = q AS alike
    expect:
      kind: rows
      columns: [alike]
      rows: [[true]]

  - id: optional/gf04/path-length-function
    name: PATH_LENGTH counts the edges of a path
    features: [GF04]
    subclauses: ["20.13", "4.11.2"]
    productions: [path length expression, path value expression, path value primary]
    fixture: chain
    tags: [read, expression, path]
    # Length is edges, not nodes: this path has two nodes and one edge.
    query: |
      MATCH p = (a:Step)-[:LINK]->(b:Step)
      WHERE a.step = 0
      RETURN PATH_LENGTH(p) AS len
    expect:
      kind: rows
      columns: [len]
      rows: [[1]]

  - id: optional/g004/path-value-concatenation
    name: Two paths that meet at a node concatenate into one
    features: [G004]
    requires: [GF04]
    subclauses: ["20.13", "4.11.2"]
    productions: [path value concatenation, path value expression 1]
    fixture: chain
    tags: [read, expression, path]
    # The two operand rules of the concatenation exist because the operator is
    # not symmetric in what it accepts: the left side is a path value
    # expression, so concatenations chain leftward, and the right side is a
    # primary, so they do not chain rightward without parentheses. The second
    # pattern starts at the node the first one ended at, which is what makes
    # the two paths joinable at all, and the result is the two hop path from
    # step 0 to step 2. Its length is the sum of the two lengths, which is the
    # cheapest question that distinguishes a concatenation from an engine
    # returning either operand.
    query: |
      MATCH p = (a:Step)-[:LINK]->(b:Step), q = (b)-[:LINK]->(c:Step)
      WHERE a.step = 0
      RETURN PATH_LENGTH(p || q) AS len
    expect:
      kind: rows
      columns: [len]
      rows: [[2]]

  - id: optional/gf04/elements-function
    name: ELEMENTS answers the nodes and edges of a path as a list
    features: [GF04]
    subclauses: ["20.16", "4.11.2"]
    productions: [elements function, list value function, path value expression]
    fixture: chain
    tags: [read, expression, path]
    # A path is a value of its own and nothing indexes into one, so this is
    # the way a query reads what one holds. Two nodes and the edge between
    # them are three elements, where PATH_LENGTH of the same path is one.
    #
    # ISO names no feature of its own for the elements function, so the case
    # claims the one that covers the other function over a path. An engine
    # that has PATH_LENGTH and not this reads as partial GF04 rather than as
    # a feature it never declared.
    query: |
      MATCH p = (a:Step)-[:LINK]->(b:Step)
      WHERE a.step = 0
      RETURN SIZE(ELEMENTS(p)) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[3]]

  - id: optional/gf07/byte-string-trim
    name: TRIM removes leading and trailing bytes from a byte string
    features: [GF07]
    subclauses: ["20.25", "4.16.4"]
    productions:
      [
        byte string function,
        byte string trim function,
        byte string trim operands,
        byte string trim source,
        trim byte string,
        byte string value expression,
        byte string primary,
      ]
    tags: [read, expression, bytes]
    # Three bytes in, one byte out. The length is taken so that the row is an
    # integer: a byte string in a result would have the harness comparing
    # whatever spelling the driver chose for it, which is a fact about the
    # driver and not about the engine.
    query: |
      RETURN OCTET_LENGTH(TRIM(BOTH X'00' FROM X'00AB00')) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[1]]

  - id: optional/gv35/byte-length
    name: BYTE_LENGTH and OCTET_LENGTH both count the bytes of a byte string
    features: [GV35]
    subclauses: ["20.22", "4.16.4"]
    productions:
      [
        numeric value function,
        length expression,
        byte length expression,
        byte string value expression,
        byte string primary,
      ]
    tags: [read, expression, bytes]
    # The two names are alternatives of one rule and mean the same thing, so a
    # case that wrote only one would leave an engine free to have half the rule
    # and still pass. The corpus already writes OCTET_LENGTH in several places
    # and had never written BYTE_LENGTH, and this is where the two are asked to
    # agree.
    #
    # ISO names no feature for the length of a byte string, only for having
    # byte strings at all, so the case claims GV35 the way the elements
    # function case claims GF04. It cannot be a mandatory case that requires
    # GV35, because an engine may lawfully decline GV35 and a mandatory case it
    # then failed would be reporting a defect where the standard permits a
    # choice.
    #
    # zu has OCTET_LENGTH and answers "unknown function 'BYTE_LENGTH'" to the
    # other name.
    query: |
      RETURN BYTE_LENGTH(X'00AB00') = OCTET_LENGTH(X'00AB00') AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/gv35/byte-string-concatenation
    name: The concatenation operator joins two byte strings
    features: [GV35]
    subclauses: ["20.25", "4.16.4"]
    productions:
      [byte string value expression, byte string concatenation, byte string primary, concatenation operator]
    tags: [read, expression, bytes]
    # The same two vertical bars that join character strings, and a separate
    # rule in the grammar because the operands are of a different type. The
    # length is taken so the row is an integer: a byte string in a result would
    # have the harness comparing whatever spelling the driver chose for it.
    #
    # zu refuses with "|| joins strings, got BYTES and BYTES", which is the
    # same shape as its answer to the mandatory list concatenation case. One
    # operator with four jobs, wired to one of them.
    query: |
      RETURN OCTET_LENGTH(X'0102' || X'0304') = 4 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/gv35/byte-string-substring
    name: LEFT and RIGHT take bytes off the ends of a byte string
    features: [GV35]
    subclauses: ["20.25", "4.16.4"]
    productions: [byte string function, byte string substring function, string length]
    tags: [read, expression, bytes]
    # LEFT and RIGHT are one rule with two alternatives, so both are written
    # here. Taking two bytes from each end of a four byte string and adding the
    # lengths gives four, which an engine that counted hexits rather than bytes
    # would answer eight to.
    #
    # zu refuses both with "left() needs a string and a count of characters,
    # got BYTES", so it has the character string form of the function and not
    # the byte string one.
    query: |
      RETURN OCTET_LENGTH(LEFT(X'01020304', 2)) + OCTET_LENGTH(RIGHT(X'01020304', 2)) = 4 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/gv50/trim-list-function
    name: TRIM over a list and a number is a list value function
    features: [GV50]
    subclauses: ["20.16"]
    productions: [trim list function]
    tags: [read, expression, list]
    # The third spelling of TRIM. The first two take a character string and a
    # byte string, and this one takes a list and a count, which makes TRIM the
    # only name in the grammar that reaches three different rules depending on
    # the type of its first argument.
    #
    # The case asserts that the engine accepted the call and asserts nothing
    # about the list that came back. Which end the count applies to is settled
    # by the Syntax Rules of subclause 20.16, and the artifacts this project
    # vendors are the grammar and the feature, condition and subclause lists
    # rather than the prose. A row expectation here would be this project's
    # reading of a rule it cannot quote, and a corpus that guessed would be
    # publishing the guess as a conformance result.
    #
    # zu declines the two argument form at the comma with "expected ')', found
    # ','", so its TRIM is the string one only.
    query: |
      RETURN TRIM([1, 2, 3], 2) AS v
    expect:
      kind: accept

  - id: optional/ge05/binding-table-parameter
    name: A binding table passed in as a parameter is a binding table
    features: [GE05]
    subclauses: ["11.2", "17.7", "19.6"]
    productions: [binding table expression, reference parameter specification, substituted parameter reference, value type predicate, double dollar sign]
    tags: [read, expression, parameters]
    # A binding table is a result that has already been read, so the only way
    # one reaches a statement is from outside it, which is what this feature
    # is. The type predicate is the evidence, because a table's rows are not
    # something a statement can project and the type is the one thing about it
    # every engine that has the type can answer.
    params:
      t:
        $table:
          columns: [id]
          rows: [[1], [2]]
    query: |
      RETURN $$t IS TYPED BINDING TABLE AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/ge01/graph-value-written-with-graph
    name: A graph is a value, and the graph the query reads is one
    features: [GE01]
    requires: [GA06, GV60]
    subclauses: ["20.1", "20.2", "19.6"]
    productions: [reference value expression, graph reference value expression]
    tags: [read, expression]
    # GRAPH in front of a graph expression is what turns a name for a graph
    # into a value of graph type, and it is the only place a reference value
    # expression is written out rather than reached through a variable. The
    # parentheses are load bearing: the type predicate takes a value
    # expression primary, so the spelled form has to be parenthesized before
    # it can be asked what it is. CURRENT_PROPERTY_GRAPH is the graph the
    # query is already reading, so the case needs no catalog object.
    query: |
      RETURN ((PROPERTY GRAPH CURRENT_PROPERTY_GRAPH) IS TYPED ANY PROPERTY GRAPH) AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: optional/ge02/binding-table-value-from-a-subquery
    name: A subquery written as a binding table value has rows to count
    features: [GE02]
    requires: [GF12]
    subclauses: ["20.1", "11.2"]
    productions: [binding table reference value expression]
    fixture: social
    tags: [read, expression]
    # The case below this one reaches the same rule through a parameter, which
    # is the form an engine can support without having the expression at all.
    # This is the written form, TABLE in front of a nested query, and counting
    # the rows is the one question about a table that needs no column of it to
    # be projected.
    query: |
      RETURN CARDINALITY(BINDING TABLE { MATCH (p:Person) RETURN p.name AS name }) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: optional/ge02/binding-table-reference-value-expression
    name: A binding table reference is a value, and one table equals itself
    features: [GE02, GE05]
    subclauses: ["11.2", "17.4", "17.7"]
    productions: [binding table expression, binding table reference, reference parameter specification]
    tags: [read, expression, parameters]
    # Equality on a reference is identity and not contents, so the table
    # compared with itself is the comparison that says so without saying
    # anything about the rows in it. The case claims GE05 as well because the
    # only binding table a portable case can name is one it was handed.
    params:
      t:
        $table:
          columns: [id]
          rows: [[1], [2]]
    query: |
      RETURN $$t = $$t AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]
