# Mandatory value expressions, predicates and literals.
#
# These cases run against the one-node `unit` fixture and project a constant.
# The point is to measure the expression and not the pattern matching, and a
# fixture with exactly one node makes the expected table exactly one record
# without the case having to say anything about the graph.
#
# Nothing here uses a function ISO lists as an optional feature. The numeric
# and string functions in GF01 through GF13, the cast in GA05 and the type
# predicate in GA06 are tested in 22-optional-value.yaml.
#
# Nothing here writes a number with a decimal point either. GL04 is "Exact
# number in common notation without suffix", so `2.5` is a feature an engine
# is allowed not to have, and a mandatory case that spelled one would fail a
# conforming engine for a reason the case was not about. Where a case needs a
# non-integer it reads one from the `numbers` fixture, where the value arrives
# through the adapter's own value encoding rather than through the lexer.

defaults:
  kind: mandatory
  fixture: unit
  tags: [read, expression]

cases:
  - id: mandatory/value/literal-integer
    name: An unsigned integer literal is returned as the number it spells
    subclauses: ["21.2"]
    productions: [unsigned integer, exact numeric literal, literal]
    query: |
      RETURN 42 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[42]]

  - id: mandatory/value/literal-character-string
    name: A character string literal in single quotes is returned unchanged
    subclauses: ["21.2"]
    productions:
      [
        character string literal,
        general literal,
        unsigned literal,
        single quoted character sequence,
        unbroken single quoted character sequence,
        single quoted character representation,
        character representation,
        string literal character,
        quote,
      ]
    # The whole chain from the literal down to the characters, because the
    # rules between the two are named nowhere else in the corpus and a
    # denominator counts what is claimed. <character representation> and
    # <string literal character> are both written "!! See the Syntax Rules.",
    # so citing them claims the query contains what the standard's prose says
    # they are, which for five unremarkable letters it does.
    query: |
      RETURN 'hello' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[hello]]

  - id: mandatory/value/literal-boolean
    name: TRUE and FALSE are boolean literals
    subclauses: ["21.2"]
    productions: [boolean literal, truth value]
    query: |
      RETURN TRUE AS t, FALSE AS f
    expect:
      kind: rows
      columns: [t, f]
      rows: [[true, false]]

  - id: mandatory/value/literal-null
    name: NULL is a literal and survives projection as the null value
    subclauses: ["21.2", "4.4.5"]
    productions: [null literal]
    query: |
      RETURN NULL AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[null]]

  - id: mandatory/value/bracketed-comment
    name: Text between a solidus-asterisk pair is a comment
    subclauses: ["21.3"]
    productions: [comment, bracketed comment, bracketed comment introducer, bracketed comment terminator]
    tags: [lexical]
    # The two other comment forms are features GB02 and GB03; this one is not,
    # so it is the only comment an engine must accept.
    query: |
      RETURN /* a comment */ 1 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[1]]

  - id: mandatory/value/arithmetic-precedence
    name: Multiplication binds tighter than addition in a numeric value expression
    subclauses: ["20.21"]
    productions: [numeric value expression, term, factor]
    query: |
      RETURN 2 + 3 * 4 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[14]]

  - id: mandatory/value/arithmetic-parentheses
    name: Parentheses override operator precedence
    subclauses: ["20.21"]
    productions: [numeric value expression, value expression primary]
    query: |
      RETURN (2 + 3) * 4 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[20]]

  - id: mandatory/value/arithmetic-negation
    name: A unary minus negates a numeric value expression
    subclauses: ["20.21"]
    productions: [signed numeric literal, numeric value expression]
    query: |
      RETURN 7 + -2 AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[5]]

  - id: mandatory/value/string-concatenation
    name: The concatenation operator joins two character strings
    subclauses: ["20.23"]
    productions:
      [
        string value expression,
        character string concatenation,
        character string value expression,
        character string primary,
        concatenation operator,
      ]
    query: |
      RETURN 'ab' || 'cd' AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[abcd]]

  - id: mandatory/value/list-concatenation
    name: The concatenation operator joins two lists
    subclauses: ["20.15"]
    productions:
      [
        list value expression,
        list concatenation,
        list value expression 1,
        list primary,
        concatenation operator,
      ]
    tags: [list]
    # ISO gives one operator four jobs: strings, byte strings, lists and paths
    # all concatenate with the same two bars, and each is a rule of its own
    # rather than one polymorphic rule. An engine that wired the operator to
    # strings alone answers a type error here, which is what zu does: "|| joins
    # strings, got LIST<INT> and LIST<INT>". Engine finding.
    query: |
      RETURN [1, 2] || [3] AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[[1, 2, 3]]]

  - id: mandatory/value/fold
    name: UPPER and LOWER change the case of a character string
    subclauses: ["20.24"]
    productions: [fold, character string function]
    tags: [string]
    query: |
      RETURN UPPER('aB') AS u, LOWER('aB') AS l
    expect:
      kind: rows
      columns: [u, l]
      rows: [[AB, ab]]

  - id: mandatory/value/char-length
    name: CHAR_LENGTH counts the characters of a string
    subclauses: ["20.22"]
    productions: [numeric value function, length expression, char length expression]
    tags: [string]
    query: |
      RETURN CHAR_LENGTH('abcd') AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[4]]

  - id: mandatory/value/trim-default
    name: TRIM with only a source removes spaces from both ends
    subclauses: ["20.24"]
    productions: [trim function, single-character trim function, trim source]
    tags: [string]
    # The forms that name a trim character or an end are features GF06 and
    # GF05; this one-argument form is not, so every engine must have it.
    query: |
      RETURN TRIM('  ab  ') AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[ab]]

  - id: mandatory/value/normalize
    name: NORMALIZE returns a string that is already in normal form unchanged
    subclauses: ["20.24", "19.7"]
    productions:
      [
        normalize function,
        normal form,
        keyword,
        non-reserved word,
        non-delimiter token,
        token,
      ]
    tags: [string]
    # The argument is ASCII, so the case does not depend on the engine having
    # a Unicode normalization table; it depends only on NORMALIZE existing and
    # being the identity where the standard says it is.
    #
    # NFC is where the corpus reaches <non-reserved word>. The syntactic layer
    # spells it out of <normal form>; the lexical layer reads the same three
    # letters as a keyword, and ISO lists NFC among the words that are keywords
    # without being reserved. Both readings are of one query, which is what the
    # two halves of the grammar are for, and the corpus had no case claiming
    # the second half of it.
    query: |
      RETURN NORMALIZE('ab', NFC) AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[ab]]

  - id: mandatory/value/normalized-predicate
    name: IS NORMALIZED asks of a string what NORMALIZE would do to it
    subclauses: ["19.7"]
    productions: [normalized predicate, normalized predicate part 2]
    tags: [string]
    # The predicate and the function are the two halves of one subclause and
    # the corpus had only the function. A string that NORMALIZE returns
    # unchanged is a string the predicate answers true for, and writing both
    # spellings in one row is what makes that a claim rather than a
    # coincidence: the form with a normal form named asks about NFC, the form
    # without one asks about the default, and ASCII is in every normal form so
    # both answers are fixed without a normalization table.
    query: |
      RETURN ('ab' IS NFC NORMALIZED) AS a, ('ab' IS NOT NORMALIZED) AS b
    expect:
      kind: rows
      columns: [a, b]
      rows: [[true, false]]

  - id: mandatory/value/session-user
    name: SESSION_USER is a value specification every session can write
    subclauses: ["20.3"]
    productions: [general value specification]
    # The other half of <general value specification> is a dynamic parameter,
    # which is optional GE features, so SESSION_USER is the only spelling of
    # this rule a mandatory case can reach. What it evaluates to names the
    # user the session was opened for and the standard fixes nothing about it,
    # so the case asks only that it is a value the engine can project. An
    # engine that has no notion of a user has an answer available, the null
    # value, and the case accepts that too.
    query: |
      RETURN SESSION_USER AS u
    expect:
      kind: accept

  - id: mandatory/value/comparison-yields-boolean
    name: A comparison predicate is a value expression and projects a boolean
    subclauses: ["19.3"]
    productions:
      [
        comparison predicate,
        comparison predicate part 2,
        comparison predicand,
        comp op,
        equals operator,
        less than operator,
        left angle bracket,
        less than or equals operator,
        not equals operator,
        greater than operator,
        right angle bracket,
        greater than or equals operator,
      ]
    # All six comparison operators in one row, because the ones an engine gets
    # wrong are the compound spellings rather than the plain ones: `<=` read as
    # a less than followed by an equals, or `<>` read as an empty pair of
    # brackets. Each answers true, so a reader of a failing run sees which
    # operator moved rather than which direction it moved in.
    query: |
      RETURN 1 < 2 AS lt, 2 <= 2 AS le, 3 <> 4 AS ne, 4 > 3 AS gt, 4 >= 4 AS ge, 5 = 5 AS eq
    expect:
      kind: rows
      columns: [lt, le, ne, gt, ge, eq]
      rows: [[true, true, true, true, true, true]]

  - id: mandatory/value/numeric-comparison-across-types
    name: A number with a fractional part compares against an integer without a cast
    subclauses: ["22.13", "4.4.2"]
    productions: [comparison predicate]
    fixture: numbers
    # The fractional operand is a stored property rather than a literal,
    # because writing `2` as a comparand is mandatory and writing `2.0` is
    # feature GL04. What is under test is the comparison, not the notation.
    query: |
      MATCH (v:Datum)
      WHERE v.x > 2
      RETURN v.n AS n
    expect:
      kind: rows
      unordered: true
      columns: [n]
      rows: [[3], [4]]

  - id: mandatory/value/null-propagates-through-arithmetic
    name: An arithmetic operand that is null makes the result null
    subclauses: ["20.21", "4.4.5"]
    productions: [numeric value expression, null literal]
    tags: [null]
    query: |
      RETURN 1 + NULL AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[null]]

  - id: mandatory/value/boolean-operators
    name: AND, OR and NOT combine boolean values
    subclauses: ["20.20"]
    productions: [boolean value expression, boolean term, boolean factor]
    query: |
      RETURN (TRUE AND FALSE) AS a, (TRUE OR FALSE) AS b, (NOT TRUE) AS c
    expect:
      kind: rows
      columns: [a, b, c]
      rows: [[false, true, false]]

  - id: mandatory/value/three-valued-logic
    name: A boolean operand that is unknown gives an unknown result, not false
    subclauses: ["20.20", "4.4.5"]
    productions: [boolean value expression]
    tags: [null]
    query: |
      RETURN TRUE AND NULL AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[null]]

  - id: mandatory/value/three-valued-logic-short-circuit
    name: FALSE AND unknown is false, because no operand can make it true
    subclauses: ["20.20"]
    productions: [boolean value expression]
    tags: [null]
    query: |
      RETURN FALSE AND NULL AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[false]]

  - id: mandatory/value/parenthesized-boolean-value-expression
    name: Parentheses around a boolean expression make it an operand again
    subclauses: ["20.20"]
    productions:
      [
        boolean test,
        boolean primary,
        boolean predicand,
        parenthesized boolean value expression,
        left paren,
        right paren,
      ]
    # The grammar climbs from <boolean value expression> down to <boolean test>
    # and <boolean primary>, and the only way back up is this rule. Without it
    # OR could never appear inside AND, because AND takes a term and OR makes
    # an expression. The case writes exactly that shape, so an engine whose
    # precedence is wrong or whose parentheses are cosmetic answers something
    # other than true.
    query: |
      RETURN (TRUE OR FALSE) AND TRUE AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: mandatory/value/boolean-test-is-true
    name: IS TRUE asks a three-valued expression for a two-valued answer
    subclauses: ["20.20", "4.4.5"]
    productions: [boolean test, boolean primary, truth value]
    # The optional half of <boolean test>, which is the one place GQL turns
    # unknown into false. Every other boolean operator propagates unknown, so
    # without this a query has no way to say "true, and not merely not false".
    #
    # zu has none of it. The parser stops at "expected NULL, found 'TRUE'",
    # which says its IS takes the null predicate and nothing else.
    query: |
      RETURN (1 = 1) IS TRUE AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: mandatory/value/boolean-test-is-not-false
    name: NOT inverts the truth value a boolean test compares against
    subclauses: ["20.20", "4.4.5"]
    productions: [boolean test, truth value]
    # IS NOT FALSE is true of both true and unknown, which is a different
    # question from IS TRUE and is why the NOT is in the rule rather than
    # written outside it. The operand here is true, so the two agree; the case
    # below is where they part.
    query: |
      RETURN (1 = 1) IS NOT FALSE AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: mandatory/value/boolean-test-is-unknown
    name: UNKNOWN is a truth value a boolean test may compare against
    subclauses: ["20.20", "4.4.5"]
    productions: [boolean test, truth value]
    tags: [null]
    # The third truth value, and the only way to ask an engine directly whether
    # a comparison came out unknown rather than false. A comparison with null
    # is the standard way to reach one.
    query: |
      RETURN (NULL = 1) IS UNKNOWN AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[true]]

  - id: mandatory/value/case-searched
    name: A searched case expression returns the result of its first true when clause
    subclauses: ["20.7"]
    productions:
      [
        case expression,
        case specification,
        searched case,
        searched when clause,
        else clause,
        result,
        result expression,
      ]
    query: |
      RETURN CASE WHEN 1 > 2 THEN 'no' WHEN 1 < 2 THEN 'yes' ELSE 'neither' END AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[yes]]

  - id: mandatory/value/case-simple
    name: A simple case expression compares its operand against each when clause
    subclauses: ["20.7"]
    productions:
      [simple case, case operand, simple when clause, when operand list, when operand, else clause, result]
    query: |
      RETURN CASE 2 WHEN 1 THEN 'one' WHEN 2 THEN 'two' ELSE 'other' END AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[two]]

  - id: mandatory/value/case-when-operand-list
    name: One when clause may hold several operands separated by commas
    subclauses: ["20.7"]
    productions: [simple when clause, when operand list, when operand, comma]
    # The when operand list is what makes the simple case worth having over a
    # chain of comparisons: a clause may name several operands and any of them
    # matching selects the result. Writing one operand exercises the rule and
    # does not show whether an engine read the list or only the first item, so
    # this case writes two and matches on the first, which fails an engine that
    # takes the comma and ignores what follows it.
    #
    # zu declines it at the comma with "expected THEN, found ','", so it has
    # the simple case and not the list.
    query: |
      RETURN CASE 1 WHEN 1, 2 THEN 'yes' ELSE 'no' END AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[yes]]

  - id: mandatory/value/case-when-operand-is-a-comparison
    name: A when operand may be the right half of a predicate rather than a value
    subclauses: ["20.7", "19.4"]
    productions: [when operand, comparison predicate part 2]
    # The second thing a when operand may be. ISO lets the operand start with
    # the operator, so the case operand is compared with the rest of the
    # predicate rather than for equality, and the eight alternatives of <when
    # operand> are the eight predicates that have a part 2. Without this a
    # simple case can only ask whether its operand equals something.
    #
    # zu declines it with "expected an expression, found '>'", so its when
    # operand is a value and nothing else.
    query: |
      RETURN CASE 3 WHEN > 1 THEN 'yes' ELSE 'no' END AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[yes]]

  - id: mandatory/value/case-result-is-null
    name: The result of a when clause may be the null literal
    subclauses: ["20.7"]
    productions: [result, null literal]
    tags: [null]
    # <result> is a value expression or the null literal, and the two are
    # separate alternatives because a bare NULL is not a value expression
    # anywhere else in this position. The else branch returns a string, so an
    # engine that decided the whole expression was of the null type disagrees
    # with the case rather than passing it by accident.
    query: |
      RETURN CASE 1 WHEN 1 THEN NULL ELSE 'other' END AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[null]]

  - id: mandatory/value/case-else-omitted
    name: A case expression with no matching when clause and no else is null
    subclauses: ["20.7"]
    productions: [searched case]
    tags: [null]
    query: |
      RETURN CASE WHEN 1 > 2 THEN 'no' END AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[null]]

  - id: mandatory/value/coalesce
    name: COALESCE returns its first operand that is not null
    subclauses: ["20.7"]
    productions: [case abbreviation]
    tags: [null]
    query: |
      RETURN COALESCE(NULL, 'x', 'y') AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[x]]

  - id: mandatory/value/nullif
    name: NULLIF returns null when its operands are equal
    subclauses: ["20.7"]
    productions: [case abbreviation]
    tags: [null]
    query: |
      RETURN NULLIF(1, 1) AS alike, NULLIF(1, 2) AS unlike
    expect:
      kind: rows
      columns: [alike, unlike]
      rows: [[null, 1]]

  - id: mandatory/value/is-null-predicate
    name: IS NULL is true of a property whose value is null
    subclauses: ["19.5"]
    productions: [null predicate, null predicate part 2]
    fixture: nullable
    tags: [null]
    query: |
      MATCH (m:Maybe)
      WHERE m.note IS NULL
      RETURN m.id AS id
    expect:
      kind: rows
      unordered: true
      columns: [id]
      rows: [[2]]

  - id: mandatory/value/is-not-null-predicate
    name: IS NOT NULL is true of a property that has a value
    subclauses: ["19.5"]
    productions: [null predicate]
    fixture: nullable
    tags: [null]
    query: |
      MATCH (m:Maybe)
      WHERE m.note IS NOT NULL
      RETURN m.id AS id
    expect:
      kind: rows
      unordered: true
      columns: [id]
      rows: [[1]]

  - id: mandatory/value/comparison-with-null-is-unknown
    name: A comparison against null is unknown, so it filters the binding out
    subclauses: ["19.3", "22.13"]
    productions: [comparison predicate]
    fixture: nullable
    tags: [null]
    query: |
      MATCH (m:Maybe)
      WHERE m.note = 'present'
      RETURN m.id AS id
    expect:
      kind: rows
      unordered: true
      columns: [id]
      rows: [[1]]

  - id: mandatory/value/string-ordering
    name: Character strings compare in the order the collation gives them
    subclauses: ["22.14", "22.16"]
    productions: [comparison predicate]
    fixture: social
    query: |
      MATCH (p:Person)
      WHERE p.name < 'C'
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Alice], [Bob]]

  - id: mandatory/value/parameter-reference
    name: A general parameter reference binds a value supplied outside the statement
    subclauses: ["20.4"]
    productions:
      [
        dynamic parameter specification,
        general parameter reference,
        parameter name,
        separated identifier,
        extended identifier,
        dollar sign,
      ]
    tags: [parameters]
    # <separated identifier> ::= <extended identifier> | <delimited identifier>
    # and there is no third alternative, which settles what an unquoted name
    # is: an extended identifier. A parameter name is the one place the corpus
    # can say so, since everywhere else a name is written the grammar reaches
    # it through <regular identifier> instead.
    params:
      threshold: 40
    query: |
      RETURN $threshold AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[40]]

  - id: mandatory/value/parameter-in-predicate
    name: A parameter is usable wherever a value specification is
    subclauses: ["20.3", "20.4"]
    productions: [value specification, dynamic parameter specification]
    fixture: social
    tags: [parameters]
    params:
      threshold: 40
    query: |
      MATCH (p:Person)
      WHERE p.age > $threshold
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Carol], [Erin]]

  - id: mandatory/value/property-of-absent-key
    name: Reading a property an element does not have gives null, not an error
    subclauses: ["20.11", "4.3.4"]
    productions: [property reference]
    fixture: social
    tags: [null, edge-case]
    query: |
      MATCH (p:Person)
      WHERE p.name = 'Alice'
      RETURN p.nickname AS v
    expect:
      kind: rows
      columns: [v]
      rows: [[null]]
