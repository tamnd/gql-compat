# Grammar cases: what the parser must take and what it must refuse.
#
# A grammar case asserts acceptance or refusal and nothing else. It exists
# because a permissive parser and a conforming one give the same answers to
# every case in the rest of this suite; the difference between them only shows
# up on input the standard does not define. An engine that accepts a statement
# ISO has no production for is not more capable, it is differently specified,
# and a compatibility report that never asked would never say so.
#
# Refusal cases are deliberately not near the boundary. Each one is wrong in a
# way no reading of the grammar accommodates, so a refusal is evidence about
# the engine rather than about how the case was written.

defaults:
  kind: grammar
  fixture: unit
  tags: [syntax]

cases:
  - id: grammar/keywords-are-case-insensitive
    name: Keywords are matched without regard to case
    subclauses: ["21.3"]
    productions: [GQL terminal character, token]
    query: |
      match (u:Unit) return 1 as v
    expect:
      kind: accept

  - id: grammar/keywords-mixed-case
    name: A keyword may mix cases within itself
    subclauses: ["21.3"]
    productions: [token]
    query: |
      MaTcH (u:Unit) ReTuRn 1 AS v
    expect:
      kind: accept

  - id: grammar/whitespace-between-tokens-is-free
    name: Line breaks and runs of spaces between tokens carry no meaning
    subclauses: ["21.3"]
    productions: [separator, whitespace]
    query: |
      MATCH
          (u:Unit)

      RETURN
          1     AS     v
    expect:
      kind: accept

  - id: grammar/comment-between-tokens
    name: A comment is a separator and may appear wherever whitespace may
    subclauses: ["21.3"]
    productions: [separator, comment, bracketed comment]
    query: |
      MATCH /* here */ (u:Unit) /* and here */ RETURN 1 AS v
    expect:
      kind: accept

  # The four cases below were rewritten after the Neo4j run of 2026-08-12. The
  # grammar draws a line the first version of this file missed: a delimited
  # identifier is admitted wherever the BNF writes <identifier>, and a variable
  # is not one of those places. <element variable> resolves to <binding
  # variable> and <binding variable> ::= <regular identifier>, with no
  # alternative, while <label name>, <property name> and <return item alias>
  # all resolve to <identifier> ::= <regular identifier> | <delimited
  # identifier>. Neo4j's conformance appendix states the same line from the
  # other side, under subclause 21.1: "GQL allows identifiers that are not
  # variables to be delimited with both backticks and quotes. Cypher only
  # allows backticks." The qualifier "that are not variables" is doing real
  # work and this file had not noticed it.

  - id: grammar/delimited-identifier-accent
    name: An accent-quoted identifier may stand where the grammar writes an identifier
    subclauses: ["21.3"]
    productions: [label name, delimited identifier, accent quoted character sequence]
    # This case used to put the accent-quoted identifier in the variable slot,
    # where the grammar does not admit one, and every engine tested accepted it
    # because Cypher allows backticked variables. It was scoring a pass for a
    # construct ISO has no production for, which is the one thing a grammar
    # case exists to prevent. The identifier now sits in a label name, where
    # <identifier> really does reach <delimited identifier>.
    query: |
      MATCH (u:`Unit`)
      RETURN 1 AS v
    expect:
      kind: accept

  - id: grammar/delimited-identifier-double-quoted
    name: A double-quoted identifier is the other delimited form
    subclauses: ["21.3"]
    productions: [label name, delimited identifier, double quoted character sequence]
    # <delimited identifier> ::= <double quoted character sequence> | <accent
    # quoted character sequence>, so the two forms are interchangeable and an
    # engine that takes one and refuses the other is reading double quotes as a
    # string literal. Both zu and Neo4j refuse it. For Neo4j that is a declared
    # gap rather than a defect found here: the appendix quoted above says
    # Cypher allows only backticks, and gives MATCH (n) RETURN n."a prop" as an
    # example of GQL that Cypher will not take. Engine finding, vendor
    # acknowledged.
    query: |
      MATCH (u:"Unit")
      RETURN 1 AS v
    expect:
      kind: accept

  - id: grammar/reject-delimited-identifier-as-variable
    name: A variable is a regular identifier and cannot be delimited
    subclauses: ["21.3"]
    productions: [binding variable, element variable, regular identifier]
    # The rule the accent case used to get wrong, asserted directly. There is
    # no reading of the BNF that admits a delimited identifier here: the chain
    # is <element variable> ::= <binding variable> ::= <regular identifier>,
    # one alternative and no more. Cypher accepts backticked variables, so this
    # is expected to fail on Neo4j and on anything else that grew out of
    # Cypher. That is the divergence being reported.
    query: |
      MATCH (`odd name`:Unit)
      RETURN 1 AS v
    expect:
      kind: reject

  - id: grammar/delimited-identifier-holds-a-keyword
    name: Delimiting an identifier lets it be spelled like a keyword
    subclauses: ["21.3"]
    productions: [return item alias, identifier, delimited identifier]
    # <return item alias> ::= AS <identifier>, and <identifier> admits the
    # delimited form, so the alias slot is one of the places a reserved word
    # may be spelled out. The productions field used to say binding variable,
    # which is the slot this case is specifically not testing.
    query: |
      RETURN 1 AS `MATCH`
    expect:
      kind: accept

  - id: grammar/reject-keyword-as-bare-identifier
    name: A reserved word is not a regular identifier
    subclauses: ["21.3"]
    productions: [regular identifier, return item alias]
    # MATCH is in <reserved word> in the BNF. The exclusion of reserved words
    # from <regular identifier> lives in the Syntax Rules prose rather than in
    # the productions, so the machine-readable artifact alone does not settle
    # it, but Neo4j's appendix does: subclause 21.3 is on its list of mandatory
    # features Cypher does not support, with the note that GQL reserves words
    # that cannot be used as unquoted variable names, labels and property
    # names, and that Cypher's list differs. Both engines accept this. Engine
    # finding, vendor acknowledged.
    query: |
      RETURN 1 AS MATCH
    expect:
      kind: reject

  # grammar/reject-trailing-semicolon was removed after the Neo4j run of
  # 2026-08-12. The semicolon character appears nowhere in the 814 productions
  # and <GQL-program> has no terminator, so the case was right that ISO does
  # not define it, but being undefined is not the same as being forbidden.
  # Subclause 24.5.3 lets an implementation add constructs it documents, and
  # every engine tested takes a trailing semicolon, so scoring a fail for it
  # was scoring a preference. The header of this file already says refusal
  # cases are deliberately not near the boundary, and that one was sitting on
  # it. The observation is worth keeping and it belongs in the
  # implementation-defined section, which is M5.

  - id: grammar/reject-dangling-edge-pattern
    name: An edge pattern with no node after it is not a path pattern
    subclauses: ["16.7"]
    productions: [path pattern expression, path concatenation]
    query: |
      MATCH (u:Unit)-[e:LINK]->
      RETURN 1 AS v
    expect:
      kind: reject

  - id: grammar/reject-match-with-no-pattern
    name: MATCH requires a graph pattern
    subclauses: ["14.4"]
    productions: [match statement, graph pattern]
    query: |
      MATCH
      RETURN 1 AS v
    expect:
      kind: reject

  - id: grammar/reject-adjacent-labels-without-an-operator
    name: Two label names side by side are not a label expression
    subclauses: ["16.8"]
    productions: [label expression, label term]
    query: |
      MATCH (x:Unit Other)
      RETURN 1 AS v
    expect:
      kind: reject

  - id: grammar/reject-double-equals
    name: The equality operator is one equals sign
    subclauses: ["19.3"]
    productions: [comparison predicate, equals operator]
    query: |
      MATCH (u:Unit)
      WHERE 1 == 1
      RETURN 1 AS v
    expect:
      kind: reject

  - id: grammar/reject-unterminated-string-literal
    name: A quote with no closing quote is not a token
    subclauses: ["21.2"]
    productions: [character string literal, unbroken single quoted character sequence]
    query: |
      RETURN 'unterminated AS v
    expect:
      kind: reject

  - id: grammar/reject-unterminated-bracketed-comment
    name: A bracketed comment must be closed
    subclauses: ["21.3"]
    productions: [bracketed comment, bracketed comment terminator]
    query: |
      RETURN 1 AS v /* never closed
    expect:
      kind: reject

  - id: grammar/reject-return-before-match
    name: A result statement does not precede the statement it draws from
    subclauses: ["14.3"]
    productions: [simple linear query statement, primitive result statement]
    query: |
      RETURN 1 AS v
      MATCH (u:Unit)
    expect:
      kind: reject

  - id: grammar/reject-property-access-on-a-literal
    name: A period after a number is not a property reference
    subclauses: ["20.11"]
    productions: [property reference, element variable reference]
    query: |
      RETURN 1.name AS v
    expect:
      kind: reject

  - id: optional/gb01/long-identifier
    kind: optional
    name: An identifier may be longer than the minimum an engine must support
    features: [GB01]
    subclauses: ["21.3"]
    productions: [regular identifier, identifier extend]
    # ISO makes support for long identifiers a feature rather than a rule, and
    # sets no length in the mandatory case, so the only honest test is one
    # identifier that is plainly long. This one is 128 characters.
    query: |
      RETURN 1 AS aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaabbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbccccccccccccccccccccccccccccccccdddddddddddddddddddddddddddddddd
    expect:
      kind: accept
