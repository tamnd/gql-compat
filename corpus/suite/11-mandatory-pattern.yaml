# Mandatory graph patterns: node patterns, the right-pointing full edge
# pattern, concatenation, path pattern lists, label expressions and the local
# element pattern predicate.
#
# The edge patterns here are all the right-pointing full form. ISO makes the
# other five full forms one optional feature (G043) and the abbreviated forms
# two more (G044, G045), so a case using `<-[e]-` or `->` would be claiming a
# feature under the heading of a mandatory subclause. Those spellings are
# tested in 21-optional-pattern.yaml, where losing them costs a feature and
# nothing more.

defaults:
  kind: mandatory
  fixture: social
  tags: [read, pattern]

cases:
  - id: mandatory/pattern/node-pattern-unlabelled
    name: A node pattern with only a variable binds every node in the graph
    subclauses: ["16.4", "22.2", "4.2.6", "4.11.4"]
    productions: [node pattern, element variable declaration]
    # The simplest match there is, which is why 22.2 is cited here rather than
    # anywhere else. That subclause is the machinery the standard defines
    # matching in terms of, and a pattern with no label and no predicate is the
    # one case where the answer is the machinery and nothing else: every node
    # in the graph, once each.
    #
    # It is also where the two concepts underneath that answer belong. Subclause
    # 4.2.6 is GQL-data, and a count of seven is a claim about how much of it
    # there is; an engine that keeps nodes somewhere the catalog cannot see has
    # a different number here. Subclause 4.11.4 is graph pattern variables, and
    # x is one declared with nothing else attached, which is the smallest a
    # declaration gets.
    query: |
      MATCH (x)
      RETURN COUNT(*) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[7]]

  - id: mandatory/pattern/edge-pattern-directed
    name: A right-pointing full edge pattern binds edges of a type in their direction
    subclauses: ["16.7", "22.3"]
    productions:
      [
        element pattern,
        edge pattern,
        full edge pattern,
        full edge pointing right,
        path pattern expression,
        minus left bracket,
        bracket right arrow,
      ]
    query: |
      MATCH (p:Person)-[k:KNOWS]->(q:Person)
      RETURN p.name AS knower, q.name AS known
    expect:
      kind: rows
      unordered: true
      columns: [knower, known]
      rows:
        - [Alice, Bob]
        - [Bob, Carol]
        - [Alice, Carol]
        - [Carol, Dave]
        - [Dave, Erin]

  - id: mandatory/pattern/edge-property-predicate
    name: A property of an edge variable is readable in a where clause
    subclauses: ["16.7", "16.13", "16.10", "20.11", "22.6", "4.11.5"]
    productions: [property reference, element variable reference, period, edge reference value expression]
    # The source of a property reference is a node, an edge or a record, and
    # the grammar has a rule for each. This is the corpus case where the source
    # is an edge.
    #
    # 16.10 is the reference itself and 22.6 is what the engine has to do with
    # it: apply the bindings the pattern produced before the expression can be
    # evaluated at all. Every case in the corpus that names a variable in an
    # expression does that, and this is the one that says so. Subclause 4.11.5
    # is the same point in prose, references to graph pattern variables, which
    # is what k is in a clause the pattern has already finished with.
    query: |
      MATCH (p:Person)-[k:KNOWS]->(q:Person)
      WHERE k.since > 2018
      RETURN p.name AS knower, q.name AS known
    expect:
      kind: rows
      unordered: true
      columns: [knower, known]
      rows:
        - [Alice, Carol]
        - [Carol, Dave]
        - [Dave, Erin]

  - id: mandatory/pattern/edge-type-selects
    name: An edge type in a pattern excludes edges of every other type
    subclauses: ["16.7", "16.8"]
    productions: [edge pattern, label expression]
    query: |
      MATCH (p:Person)-[:WORKS_AT]->(c:Company)
      RETURN p.name AS person, c.name AS company
    expect:
      kind: rows
      unordered: true
      columns: [person, company]
      rows:
        - [Alice, Acme]
        - [Bob, Acme]
        - [Carol, Globex]

  - id: mandatory/pattern/edge-pattern-untyped
    name: An empty element pattern filler matches an edge of any type
    subclauses: ["16.7"]
    productions: [element pattern filler, full edge pointing right]
    query: |
      MATCH (p:Person)-[]->()
      RETURN COUNT(*) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[8]]

  - id: mandatory/pattern/anonymous-endpoint
    name: A node pattern needs no variable to constrain a path
    subclauses: ["16.4", "16.7"]
    productions: [node pattern]
    query: |
      MATCH (p:Person)-[:KNOWS]->()
      RETURN COUNT(*) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: mandatory/pattern/path-concatenation
    name: Concatenated element patterns match a two-edge path
    subclauses: ["16.7", "4.11.3"]
    productions: [path concatenation, path term, path factor]
    # Subclause 4.11.3 is path patterns, and this is the first case in the file
    # where the pattern is a path rather than a single element: two edges laid
    # end to end are a path pattern doing the one thing only a path pattern
    # does, which is say that the end of one element is the start of the next.
    query: |
      MATCH (p:Person)-[:KNOWS]->(q:Person)-[:KNOWS]->(r:Person)
      RETURN p.name AS origin, r.name AS target
    expect:
      kind: rows
      unordered: true
      columns: [origin, target]
      rows:
        - [Alice, Carol]
        - [Bob, Dave]
        - [Alice, Dave]
        - [Carol, Erin]

  - id: mandatory/pattern/path-pattern-list-joins
    name: Two path patterns in one graph pattern join on their shared variable
    subclauses: ["16.4"]
    productions: [path pattern list, path pattern, graph pattern, comma]
    query: |
      MATCH (p:Person)-[:KNOWS]->(q:Person), (q)-[:KNOWS]->(r:Person)
      RETURN p.name AS origin, r.name AS target
    expect:
      kind: rows
      unordered: true
      columns: [origin, target]
      rows:
        - [Alice, Carol]
        - [Bob, Dave]
        - [Alice, Dave]
        - [Carol, Erin]

  - id: mandatory/pattern/property-specification
    name: A property key-value pair in a pattern filters as an equality would
    subclauses: ["16.4"]
    productions:
      [
        element property specification,
        property key value pair list,
        property key value pair,
        left brace,
        right brace,
        colon,
      ]
    query: |
      MATCH (p:Person {name: 'Alice'})
      RETURN p.age AS age
    expect:
      kind: rows
      columns: [age]
      rows: [[34]]

  - id: mandatory/pattern/element-pattern-predicate
    name: A local where clause inside an element pattern filters that element
    subclauses: ["16.4", "16.13"]
    productions: [element pattern predicate, element pattern where clause]
    query: |
      MATCH (p:Person WHERE p.age > 40)
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Carol], [Erin]]

  - id: mandatory/pattern/label-disjunction
    name: A label disjunction matches an element carrying either label
    subclauses: ["16.8", "22.5"]
    productions: [label disjunction, label expression, vertical bar]
    query: |
      MATCH (x:Person|Company)
      RETURN COUNT(*) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[7]]

  - id: mandatory/pattern/label-negation
    name: A label negation matches an element that does not carry the label
    subclauses: ["16.8", "22.5"]
    productions: [label negation, label factor, exclamation mark]
    query: |
      MATCH (x:!Company)
      RETURN COUNT(*) AS n
    expect:
      kind: rows
      columns: [n]
      rows: [[5]]

  - id: mandatory/pattern/label-conjunction
    name: A label conjunction matches only an element carrying both labels
    subclauses: ["16.8", "22.5"]
    productions: [label conjunction, label term, ampersand]
    fixture: multilabel
    query: |
      MATCH (x:Person&Employee)
      RETURN x.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Mika]]

  - id: mandatory/pattern/label-parenthesized
    name: Parentheses group a label expression against the default precedence
    subclauses: ["16.8"]
    productions: [parenthesized label expression, left paren, right paren]
    fixture: multilabel
    query: |
      MATCH (x:(Person&Employee)|Employee)
      RETURN x.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Mika]]

  - id: mandatory/pattern/exists-predicate
    name: An EXISTS predicate over a match statement filters on a pattern it does not project
    subclauses: ["19.4"]
    productions: [exists predicate, match statement block]
    query: |
      MATCH (p:Person)
      WHERE EXISTS { MATCH (p)-[:WORKS_AT]->(:Company) }
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Alice], [Bob], [Carol]]

  - id: mandatory/pattern/exists-predicate-negated
    name: NOT EXISTS keeps the bindings the pattern does not hold for
    subclauses: ["19.4", "20.20"]
    productions: [exists predicate]
    query: |
      MATCH (p:Person)
      WHERE NOT EXISTS { MATCH (p)-[:WORKS_AT]->(:Company) }
      RETURN p.name AS name
    expect:
      kind: rows
      unordered: true
      columns: [name]
      rows: [[Dave], [Erin]]

  - id: mandatory/pattern/optional-match
    name: OPTIONAL MATCH keeps a binding and nulls the variables its pattern did not bind
    subclauses: ["14.4"]
    productions: [optional match statement, optional operand]
    tags: ["null"]
    query: |
      MATCH (p:Person)
      OPTIONAL MATCH (p)-[:WORKS_AT]->(c:Company)
      RETURN p.name AS name, c.name AS company
    expect:
      kind: rows
      unordered: true
      columns: [name, company]
      rows:
        - [Alice, Acme]
        - [Bob, Acme]
        - [Carol, Globex]
        - [Dave, null]
        - [Erin, null]

  - id: mandatory/pattern/self-loop
    name: An edge whose endpoints are the same node matches a two-node pattern
    subclauses: ["16.7"]
    productions: [path concatenation]
    fixture: selfloop
    tags: [edge-case]
    query: |
      MATCH (x:Peer)-[:FRIEND]->(y:Peer)
      RETURN x.name AS source, y.name AS target
    expect:
      kind: rows
      unordered: true
      columns: [source, target]
      rows: [[solo, solo]]

  - id: mandatory/pattern/parallel-edges
    name: Two edges between one pair of nodes are two bindings, not one
    subclauses: ["16.7", "4.11.6"]
    productions: [edge pattern]
    fixture: parallel
    tags: [edge-case]
    query: |
      MATCH (x:Peer)-[f:FRIEND]->(y:Peer)
      RETURN f.rank AS rank
    expect:
      kind: rows
      unordered: true
      columns: [rank]
      rows: [[1], [2]]
